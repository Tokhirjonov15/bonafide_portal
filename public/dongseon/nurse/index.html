<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반듯한정형외과 간호팀 신규입사자 안내문</title>
<meta name="description" content="반듯한정형외과 간호팀 신규입사자 안내문">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
  :root{
    --paper:#F2F3F0;        /* 배경: 표준용지 살짝 녹색끼 흰색 */
    --sheet:#FFFFFF;        /* 문서 시트 */
    --ink:#20262E;          /* 먹색 글자 */
    --sub:#5C6672;          /* 보조 글자 */
    --faint:#8A93A0;
    --line:#E3E2DA;         /* 헤어라인 */
    --navy:#1D2735;         /* 상단 바: 공문 먹감 */
    --red:#B3402E;          /* 결재 도장 주홍 */
    --amber:#B9821E;        /* 유의사항 */
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    font-size:15px;line-height:1.6;
    word-break:keep-all;overflow-wrap:break-word;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid #2458A6;outline-offset:2px;border-radius:4px}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}

  /* ── 상단 바 ─────────────────────────── */
  .topbar{background:var(--navy);color:#F5F4EF}
  .topbar .wrap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-top:20px;padding-bottom:18px}
  .brand{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.02em}
  .brand small{font-family:inherit;font-weight:400;font-size:12px;color:#B9C2CE;margin-left:10px;letter-spacing:.08em}
  .doc-chip{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;
    color:#C9D2DC;border:1px solid #3A4656;border-radius:999px;padding:3px 12px;letter-spacing:.04em}

  /* ── 브레드크럼 바 (고정) ─────────────── */
  .crumbbar{position:sticky;top:0;z-index:20;background:rgba(242,243,240,.94);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .crumbbar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
  .crumbs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
  .crumbs::-webkit-scrollbar{display:none}
  .crumb{white-space:nowrap;font-size:13px;color:var(--sub);padding:4px 8px;border-radius:6px;flex-shrink:0}
  .crumb:hover{background:#E7E8E2;color:var(--ink)}
  .crumb.home{display:inline-flex;align-items:center;gap:6px}
  .crumb[aria-current]{color:var(--ink);font-weight:700}
  .crumb-sep{color:#C2C7BD;font-size:12px;flex-shrink:0}
  .backbtn{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid #D4D4CA;border-radius:999px;
    padding:5px 13px;background:#fff;transition:border-color .15s}
  .backbtn:hover{border-color:var(--ink)}
  .crumbbar .wrap{flex-wrap:wrap}
  .search{position:relative;flex:0 1 300px;min-width:200px;display:flex;align-items:center}
  .search-ic{position:absolute;left:12px;color:var(--faint);pointer-events:none}
  .search input{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;border:1px solid #D4D4CA;border-radius:999px;padding:7px 34px 7px 34px;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,39,53,.08)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .search-kbd{position:absolute;right:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 6px;background:#FAFAF7;pointer-events:none}
  .search input:focus ~ .search-kbd,.search input:not(:placeholder-shown) ~ .search-kbd{display:none}
  .search-pop{position:absolute;top:calc(100% + 8px);right:0;width:min(520px,calc(100vw - 40px));max-height:min(70vh,560px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(29,39,53,.16);padding:6px;z-index:40}
  .sr-head{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);padding:8px 10px 6px}
  .sr{display:block;width:100%;text-align:left;border-radius:8px;padding:9px 12px;cursor:pointer}
  .sr:hover,.sr.on{background:#F2F3EE}
  .sr-t{display:block;font-size:14.5px;font-weight:700;color:var(--ink)}
  .sr-p{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
  .sr-s{display:block;font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr mark{background:#FFE45C;color:inherit;border-radius:3px;padding:0 1px}
  mark.page-hl{background:#FFE45C;color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px #F2CE2A}
  mark.page-hl-first{animation:hlPulse 1.4s ease-out 2}
  @keyframes hlPulse{0%{box-shadow:0 0 0 1px #F2CE2A,0 0 0 0 rgba(255,214,0,.7)}100%{box-shadow:0 0 0 1px #F2CE2A,0 0 0 10px rgba(255,214,0,0)}}
  .sr-empty{padding:18px 12px;font-size:13.5px;color:var(--sub);text-align:center}
  @media (max-width:640px){.search{order:-1;flex:1 1 100%}.search-pop{left:0;right:auto;width:100%}}

  /* ── 본문 공통 ───────────────────────── */
  main{padding:34px 0 70px}
  .page-head{margin-bottom:24px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--faint)}
  .kicker::before{content:'';width:16px;height:3px;background:var(--dept,var(--navy));border-radius:2px}
  h1.page-title{font-family:'Gowun Batang',serif;font-size:clamp(24px,4vw,30px);font-weight:700;line-height:1.35;margin:6px 0 6px}
  .page-desc{font-size:14px;color:var(--sub);max-width:56ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

  /* ── 메뉴 카드 (서류철 라벨) ───────────── */
  .card{position:relative;display:block;width:100%;text-align:left;background:var(--sheet);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 15px 24px;
    overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--dept)}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(29,39,53,.09);border-color:#CDCDC2}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:600;
    color:var(--dept);background:color-mix(in srgb,var(--dept) 9%,#fff);
    border:1px solid color-mix(in srgb,var(--dept) 26%,#fff);border-radius:6px;padding:2px 8px;letter-spacing:.03em}
  .card-arrow{margin-left:auto;color:#B9BFB4;transition:transform .18s ease,color .18s ease}
  .card:hover .card-arrow{transform:translateX(3px);color:var(--dept)}
  .card-name,.card-desc{display:block}
  .card-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .card-desc{font-size:13px;color:var(--sub);margin-top:4px}
  .card-meta{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);
    font-size:12px;color:var(--faint);display:flex;justify-content:space-between;align-items:center}

  /* ── 홈 ─────────────────────────────── */
  .hero{padding:6px 0 26px}
  .hero-split{display:grid;grid-template-columns:1fr minmax(300px,380px);gap:24px;align-items:start}
  .hero-r .med-search{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
  .ms-title{margin:0 0 10px;font-size:13px;letter-spacing:.14em;color:var(--faint)}
  .ms-hint{margin:8px 0 0;font-size:11.5px;color:var(--faint)}
  #medModal{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.7);display:none;align-items:center;justify-content:center;padding:24px}
  #medModal.on{display:flex;animation:lbIn .15s ease}
  .ms-pop{position:relative;width:min(640px,94vw);max-height:84vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .ms-pop-body{padding:18px 20px 20px}
  .ms-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(15,23,42,.08);color:var(--navy);font-size:15px;cursor:pointer;display:grid;place-items:center}
  .ms-x:hover{background:rgba(15,23,42,.16)}
  @media (max-width:860px){.hero-split{grid-template-columns:1fr}}
  .hero h1{font-family:'Gowun Batang',serif;font-size:clamp(28px,5vw,38px);font-weight:700;line-height:1.3}
  .hero p{margin-top:10px;color:var(--sub);font-size:14.5px}
  .hero .stats{margin-top:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--faint)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px}
  .quick-label{width:100%;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--faint);margin-bottom:2px}
  .quick-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;transition:border-color .15s,transform .15s}
  .quick-chip:hover{border-color:var(--ink);transform:translateY(-1px)}
  .quick-chip .dot{width:8px;height:8px;border-radius:2px;background:var(--dept)}
  .home-section+.home-section{margin-top:38px}
  .home-section h2{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--faint);margin-bottom:14px;
    display:flex;align-items:center;gap:10px}
  .home-section h2::after{content:'';flex:1;height:1px;background:var(--line)}
  .grid.dept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:680px){.grid.dept-grid{grid-template-columns:1fr}}

  /* ── 내용 문서 시트 ──────────────────── */
  .sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:14px;
    padding:clamp(22px,4vw,42px);max-width:780px}
  .sheet .kicker{margin-bottom:2px}
  .sheet h1{font-family:'Gowun Batang',serif;font-size:clamp(22px,3.6vw,27px);font-weight:700;line-height:1.35;
    padding-right:86px}
  .summary{color:var(--sub);font-size:14px;margin-top:10px;max-width:58ch}
  .doc-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:22px 0 6px}
  .doc-meta div{background:#FBFBF8;padding:10px 14px}
  .doc-meta dt{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
  .doc-meta dd{font-size:13.5px;font-weight:600;margin-top:2px}
  .doc-meta .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}

  .sub-hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .setup-banner{display:flex;align-items:center;gap:12px;margin:2px 0 22px;padding:14px 18px;border:1.5px solid color-mix(in srgb,var(--dept,#1D2735) 45%,#fff);border-radius:12px;background:color-mix(in srgb,var(--dept,#1D2735) 9%,#fff);text-decoration:none;color:inherit;cursor:pointer;box-shadow:0 2px 12px rgba(15,23,42,.08);transition:transform .15s,box-shadow .15s,border-color .15s}
  .setup-banner::before{content:'';align-self:stretch;width:5px;border-radius:3px;background:var(--dept,#1D2735);flex-shrink:0}
  .setup-banner b{font-size:15px;white-space:nowrap;color:var(--dept,#1D2735)}
  .setup-banner span{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--dept,#1D2735) 60%,#000)}
  .setup-banner em{margin-left:auto;font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--dept,#1D2735);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1;flex-shrink:0}
  .setup-banner:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.16);border-color:var(--dept,#1D2735)}
  .pg-nav{display:flex;gap:6px;flex-shrink:0;padding-top:4px}
  .pg-nav button{font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
  .pg-nav button:hover:not(:disabled){border-color:var(--dept,#333);background:#fff}
  .pg-nav button:disabled{opacity:.35;cursor:default}
  .sec{margin-top:30px}
  .sec-label{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;
    letter-spacing:.16em;color:var(--faint);margin-bottom:14px}
  .sec-label::before{content:'';width:16px;height:3px;border-radius:2px;background:var(--dept)}

  .steps{list-style:none}
  .su-phase{margin-top:22px}
  .su-steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;counter-reset:none}
  .su-steps li{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:700;color:var(--ink)}
  .su-steps li .step-n{width:22px;height:22px;font-size:11.5px}
  .su-steps li+li{position:relative}
  .su-alert{margin-top:10px;padding:10px 14px;border-radius:8px;background:#fdecec;color:#b42318;font-size:13.5px;font-weight:600;text-wrap:pretty}
  .su-alert b{font-weight:800}.su-alert code{font-family:ui-monospace,Consolas,monospace;font-weight:800}
  .su-after .su-steps li{background:#f6f7f6}
  .su-set{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
  .su-photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .su-photos .su-img{aspect-ratio:4/5}
  .su-img img{object-position:center !important}
  .su-spec{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .su-spec>div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
  .su-spec>div:first-child{border-top:0}
  .su-spec dt{color:var(--sub);font-weight:700;font-size:13px}
  .su-spec dd{color:var(--ink);font-weight:600}
  .su-spec>div.hl{background:#fdecec}.su-spec>div.hl dd{color:#b42318;font-weight:800}
  .su-ex{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
  .su-ex-l{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.04em}
  .su-ex code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--ink)}
  .su-ex-r{display:flex;gap:8px;align-items:baseline;margin-left:auto}.su-ex-r span{color:var(--sub);font-size:12px}.su-ex-r b{color:#b42318;font-size:15px}
  @media (max-width:720px){.su-set{grid-template-columns:1fr}}
  .gd{margin:0 0 22px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--dept);border-radius:12px;padding:18px 22px 10px}
  .gd-title{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:8px}
  .gd-steps{list-style:none;display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;grid-auto-columns:1fr;column-gap:28px}
  .gd-steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .gd-steps li:nth-child(1),.gd-steps li:nth-child(4){border-top:0}
  .gd-n{width:26px;height:26px;border-radius:50%;background:var(--dept);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center}
  .gd-t{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.55;text-wrap:pretty;margin-top:2px}
  .gd-t b{font-weight:800}
  .gd-t em{font-style:normal;font-weight:800}.gd-t em.r{color:#c62828}.gd-t em.b{color:#1d4ed8}
  .gd-d{font-size:13px;color:var(--sub);line-height:1.5;margin-top:3px;text-wrap:pretty}
  @media (max-width:720px){.gd-steps{grid-auto-flow:row;grid-template-rows:none}.gd-steps li:nth-child(4){border-top:1px dashed var(--line)}}
  .pos-list{display:grid;gap:16px}
  .pos-hero{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:16px;align-items:stretch;margin-bottom:0}
  .pos-card-img img{object-fit:contain;background:#fff}
  .pos-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--dept,#1D2735);color:#fff;font-size:12px;margin-right:8px;flex-shrink:0}
  .pos-hero-txt h3{display:flex;align-items:center;gap:2px}
  .pos-card-img{aspect-ratio:auto;min-height:200px;height:100%}
  .pos-card-img img{width:100%;height:100%;object-fit:cover;object-position:center;background:#fff}
  .pos-card-img.pos-multi{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;height:100%}
  .pos-card-img.pos-multi img{width:100%;height:100%;min-height:0;aspect-ratio:auto;object-fit:cover;background:#fff;border-radius:8px}
  .pos-card-img img{object-fit:contain;background:#fff}
  .pos-hero .shot{height:100%}
  .pos-hero .pos-hero-img{aspect-ratio:auto;flex:1;min-height:0}
  .pos-hero .shot-img img{object-fit:cover}
  .pos-hero-txt{background:color-mix(in srgb,var(--dept,#1D2735) 6%,#fff);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .pos-hero-txt h3{margin:0 0 2px;font-size:16px;color:var(--dept,#1D2735)}
  .pos-hero-txt ul{margin:0;padding-left:16px;display:grid;gap:5px;font-size:13.5px;line-height:1.55}
  .pos-hero-txt li b{color:var(--dept,#1D2735)}
  .pos-note{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .med-search{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
  .ms-row{display:flex;gap:8px}
  .ms-row input{flex:1;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
  .ms-row input:focus{outline:0;border-color:var(--dept,#1D2735);box-shadow:0 0 0 3px rgba(29,39,53,.08)}
  .ms-row button{font:inherit;font-size:13.5px;font-weight:800;padding:10px 18px;border:0;border-radius:10px;background:var(--dept,#1D2735);color:#fff;cursor:pointer}
  .ms-result{margin-top:12px}
  .ms-idle,.ms-loading,.ms-none{margin:0;font-size:13px;color:var(--faint)}
  .ms-interp{margin:0 0 8px;font-size:12px;color:var(--faint)}
  .ms-interp b{color:var(--dept,#1D2735)}
  .ms-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
  .ms-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ms-head b{font-size:15px;color:var(--dept,#1D2735)}
  .ms-head span{font-size:11.5px;color:var(--faint)}
  .ms-ext{margin:0;font-size:13.5px;line-height:1.6}
  .ms-fig{margin:0}
  .ms-fig img{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line)}
  .ms-fig figcaption{font-size:11.5px;color:var(--faint);margin-top:4px}
  .ms-noimg{margin:0;font-size:12px;color:var(--faint)}
  .ms-link{font-size:12.5px;font-weight:700;color:var(--dept,#1D2735);text-decoration:none}

function textOf(o, skip){
  const out=[]; const SK=new Set(['id','subs','color','hot','live','cardName','groups','iv','code','codes'].concat(skip||[]));
  (function w(v,k){ if(v==null) return; if(typeof v==='string'){ if(!/^#|^man-/.test(v)) out.push(v.replace(/<[^>]+>/g,' ')); }
    else if(typeof v==='number') out.push(String(v));
    else if(Array.isArray(v)) v.forEach(x=>w(x));
    else if(typeof v==='object') for(const kk in v){ if(!SK.has(kk)) w(v[kk],kk); } })(o);
  return out.join(' · ');
}
function searchIndex(){
  if (_sIndex) return _sIndex;
  const out=[]; const add=(t,p,h,b,kind)=>out.push({t,p,h,b:b||'',kind,lt:t.toLowerCase(),all:(t+' '+p+' '+(b||'')).toLowerCase()});
  MANUAL.depts.forEach(d=>{
    add(d.name,'',`#/${d.id}`,'', '분류');
    d.items.forEach(it=>{
      add(it.name,d.name,`#/${d.id}/${it.id}`,'', '항목');
      it.docs.forEach(dc=>{
        const base=`#/${d.id}/${it.id}/${dc.id}`, pth=`${d.name} › ${it.name}`;
        add(dc.name,pth,base,textOf(dc,['name']),'문서');
        (dc.phases||[]).forEach(g=>g.items.forEach(t=>add(t,`${pth} › ${dc.name} › ${g.title}`,base,'','업무')));
        (function walk(list,href,path){ (list||[]).forEach(x=>{
          const h=href+'/'+x.id, nm=(x.name||'');
          add(nm,path,h,textOf(x,['name']), '페이지');
          (x.groups||[]).forEach(g=>g.meds.forEach(m=>add(m.n,`${path} › ${nm} › ${g.name}`,h,textOf(m,['n'])+((m.codes||[]).map(c=>' '+c[0]+' '+c[1]).join('')),'약품')));
          (x.iv||[]).forEach(r=>add(r.n,`${path} › ${nm}`,h,`${r.c} · ₩${r.p} · ${r.mix.join(' + ')}${r.time?' · '+r.time:''} · ${r.e.join(', ')}`,'수액'));
          if (x.banner) x.banner.items.forEach(b=>add(b.name+' 수량',`${path} › ${nm} › ${x.banner.title}`,h,`${b.label||'수량'} ${b.count}개${b.note?' · '+b.note:''}`,'수량'));
          walk(x.subs,h,path+' › '+nm);
        }); })(dc.subs,base,pth+' › '+dc.name);
      });
    });
  });
  return _sIndex=out;
}
const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, m => '\\' + m);
function hl(str, terms){ let h=str.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  if(!terms.length) return h; return h.replace(new RegExp('('+terms.map(escRe).join('|')+')','gi'),'<mark>$1</mark>'); }
function snippet(b, terms){ if(!b) return ''; const lb=b.toLowerCase(); let i=-1;
  for(const t of terms){ const k=lb.indexOf(t); if(k>=0 && (i<0||k<i)) i=k; }
  if(i<0) return b.slice(0,80); const st=Math.max(0,i-24); return (st?'…':'')+b.slice(st,st+90); }
function runSearch(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return [];
  const seen=new Set();
  return searchIndex().filter(r=>terms.every(t=>r.all.includes(t)))
    .map(r=>({r,score:(r.lt===terms.join(' ')?0:terms.every(t=>r.lt.includes(t))?1:2)+(r.kind==='분류'||r.kind==='항목'?.5:0)}))
    .sort((a,b)=>a.score-b.score)

    .slice(0,40).map(x=>x.r);
}

          <div><span class="rk">사용</span><span class="rv">교육 이수 확인 후 팀장과 일정 협의</span></div>

function toggleCheck(el){
  const key = el.dataset.check, c = loadChecks();
  c[key] = !c[key]; if(!c[key]) delete c[key];
  localStorage.setItem(CHECK_KEY, JSON.stringify(c));
  el.classList.toggle('on', !!c[key]); el.setAttribute('aria-checked', !!c[key]);
  const i = key.split('-')[0], t = deptOf('plan').plan.tasks[i];
  const done = t.checks.filter((_,j)=>c[i+'-'+j]).length;
  document.querySelector(`[data-cnt="${i}"]`).textContent = `${done}/${t.checks.length}`;
  document.querySelector(`[data-bar="${i}"]`).style.width = (done/t.checks.length*100)+'%';
}

  return `<div class="fade-in" style="--dept:${dept.color}">

    </button>`).join('')}</div></section>`;
}
function openShot(i){
  const sh=window._single||window._shots||[]; if(!sh.length) return;
  i=(i+sh.length)%sh.length; const x=sh[i];
  let lb=document.getElementById('lb');
  if(!lb){ lb=document.createElement('div'); lb.id='lb'; document.body.appendChild(lb);
    if(!lb._zoom){ lb._zoom=true; const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const apply=()=>{ lb.querySelectorAll('.lb-fig img').forEach(im=>{ im.style.setProperty('--z',lb._z||1); im.style.setProperty('--px',(lb._px||0)+'px'); im.style.setProperty('--py',(lb._py||0)+'px'); im.style.cursor=(lb._z>1)?'grab':'zoom-out'; }); };
      lb.addEventListener('wheel',e=>{ const im=lb.querySelector('.lb-fig img'); if(!im) return; e.preventDefault(); lb._z=clamp((lb._z||1)*(e.deltaY<0?1.2:1/1.2),1,8); if(lb._z===1){lb._px=0;lb._py=0;} apply(); },{passive:false});
      lb.addEventListener('dblclick',()=>{ lb._z=1; lb._px=0; lb._py=0; apply(); });
      let dg=null;
      lb.addEventListener('mousedown',e=>{ const im=e.target.closest('.lb-fig img'); if(!im||!(lb._z>1)) return; dg={x:e.clientX,y:e.clientY,px:lb._px,py:lb._py,moved:false}; e.preventDefault(); });
      lb.addEventListener('mousemove',e=>{ if(!dg) return; const dx=e.clientX-dg.x, dy=e.clientY-dg.y; if(Math.abs(dx)+Math.abs(dy)>4) dg.moved=true; lb._px=dg.px+dx; lb._py=dg.py+dy; apply(); });
      lb.addEventListener('mouseup',()=>{ if(dg) lb._moved=dg.moved; dg=null; }); }
    lb.addEventListener('click',e=>{ const nv=e.target.closest('[data-lbnav]'); if(nv){ openShot(+lb.dataset.i + +nv.dataset.lbnav); return; }
      const inFig=e.target.closest('.lb-fig');
      if(e.target===lb||e.target.closest('[data-lbx]')||(inFig && !(lb._z>1) && !lb._moved)) closeShot();
      lb._moved=false; }); }
  lb.dataset.i=i;
  if(!lb._swipe){ lb._swipe=true; let _tx=0;
    lb.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;},{passive:true});
    lb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-_tx; if(Math.abs(dx)>40) openShot(+lb.dataset.i + (dx<0?1:-1));},{passive:true}); }
  lb.innerHTML=`<figure class="lb-fig"><span class="lb-imgs">${(x.srcs||[x.src]).map(src=>`<img src="${src}" alt="${x.t}">`).join('')}</span><figcaption><b>${i+1} / ${sh.length}</b><span class="lb-t">${x.t}</span>${x.d?`<span class="lb-d">${x.d}</span>`:''}<span class="lb-hint">휠: 확대·축소 · 더블클릭: 원래 크기</span></figcaption></figure>
    <button class="lb-x" data-lbx aria-label="닫기">✕</button>
    ${sh.length>1?'<button class="lb-nav prev" data-lbnav="-1" aria-label="이전">‹</button><button class="lb-nav next" data-lbnav="1" aria-label="다음">›</button>':''}`;
  lb._z=1; lb._px=0; lb._py=0; lb._moved=false;
  lb.querySelectorAll('.lb-fig img').forEach(zim=>{ zim.style.setProperty('--z',1); zim.style.setProperty('--px','0px'); zim.style.setProperty('--py','0px'); });
  lb.classList.add('on'); document.body.style.overflow='hidden';
}
function closeShot(){
  window._single=null; const lb=document.getElementById('lb'); if(lb){ lb.classList.remove('on'); document.body.style.overflow=''; } }
window.addEventListener('keydown',e=>{ const lb=document.getElementById('lb'); if(!lb||!lb.classList.contains('on')) return;
  if(e.key==='Escape'){ closeShot(); } else if(e.key==='ArrowRight'){ openShot(+lb.dataset.i+1); } else if(e.key==='ArrowLeft'){ openShot(+lb.dataset.i-1); } else return;
  e.preventDefault(); e.stopImmediatePropagation(); }, true);
window.addEventListener('hashchange', closeShot);

function phaseHTML(ph){
  return ph.map(g=>`<section class="sec"><h2 class="sec-label">${g.title}<span class="grp-n">${g.items.length}개</span></h2>

}
function renderDoc(dept, item, doc){
  const SBAN = {'man-241':{t:'포지션 가이드 슬라이드',s:'포지션별 환자 자세 슬라이드 열기 (구글 슬라이드 · 새 창)',h:'https://docs.google.com/presentation/d/1w3EWA_uRfpxcYFwfTwji1RBM_XlY5YlODbloDd6haF4/edit?slide=id.g274e777daad_0_33',ext:1},'man-231':{t:'상차림 · 슈처 세트',s:'슈처 세트 차리는 법과 기본 세팅 보기',h:'#/man/man-210/man-213/man-213-u'},'man-232':{t:'상차림 · 드레싱 세트',s:'드레싱 세트 차리는 법과 기본 세팅 보기',h:'#/man/man-210/man-213/man-213-d'},'man-234':{t:'상차림 · 내성발톱 세트',s:'내성발톱 세트 차리는 법과 기본 세팅 보기',h:'#/man/man-210/man-213/man-213-n'}};
  const steps = doc.steps.map((s,i)=>`<li><span class="step-n">${i+1}</span>

  const siblings = item.docs.filter(d=>d.id!==doc.id);
  const sibIds = new Set(siblings.map(d=>d.id));
  const relHits = doc.related.map(byCode).filter(h => h && !sibIds.has(h.doc.id));
  const rel = (relHits.length||siblings.length) ? `<section class="sec"><h2 class="sec-label">관련 문서</h2>
    <div class="chips">
      ${relHits.map(h=>`<button class="chip rel mono" data-nav="#/${h.path.join('/')}">${h.doc.name}</button>`).join('')}
      ${siblings.map(d=>`<button class="chip rel mono" data-nav="#/${dept.id}/${item.id}/${d.id}">${d.name}</button>`).join('')}
    </div></section>` : '';
  return `<div class="fade-in" style="--dept:${dept.color}">
    <article class="sheet">
      <span class="kicker">${dept.name} · ${item.name}</span>
      <h1>${doc.name}</h1>${doc.id === 'man-243' ? '' : SBAN[doc.id] ? `<a class="setup-banner" ${SBAN[doc.id].ext ? `href="${SBAN[doc.id].h}" target="_blank" rel="noopener noreferrer"` : `data-nav="${SBAN[doc.id].h}"`}><b>${SBAN[doc.id].t}</b><span>${SBAN[doc.id].s}</span><em>${SBAN[doc.id].ext ? "↗" : "›"}</em></a>` : ''}

      ${notes}${forms}${rel}
    </article>
  </div>`;
}

function renderSubs(dept, item, doc, chain){
  const base = location.hash.replace(/^#/,'');

function render(){

  const doc  = item && ids[2] ? item.docs.find(d=>d.id===ids[2]) : null;
  const chain = []; let cur = doc;
  for (let k=3; cur && cur.subs && ids[k]; k++){ const nx = cur.subs.find(x=>x.id===ids[k]); if(!nx) break; chain.push(nx); cur = nx; }
  const sub = chain.length ? chain[chain.length-1] : null;
  const path = sub ? `${doc.name} › ${sub.name}` : dept && item && doc ? `${dept.name} › ${item.name} › ${doc.name}` : dept ? dept.name : '홈';

}

function markPage(terms){
  if (!terms || !terms.length) return;
  const re = new RegExp('('+terms.map(escRe).join('|')+')','gi'), reT = new RegExp(terms.map(escRe).join('|'),'i');
  const walker = document.createTreeWalker($view, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.trim() && !n.parentNode.closest('mark,script,style') && reT.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => { re.lastIndex = 0; const f = document.createDocumentFragment(); let last = 0; n.nodeValue.replace(re, (m, g, i) => { f.appendChild(document.createTextNode(n.nodeValue.slice(last, i))); const mk = document.createElement('mark'); mk.className = 'page-hl'; mk.textContent = m; f.appendChild(mk); last = i + m.length; return m; }); f.appendChild(document.createTextNode(n.nodeValue.slice(last))); n.parentNode.replaceChild(f, n); });
  const first = $view.querySelector('mark.page-hl');
  if (first) requestAnimationFrame(() => { const y = first.getBoundingClientRect().top + window.scrollY - 140; if (y > 200) window.scrollTo({top: y, behavior: 'smooth'}); first.classList.add('page-hl-first'); });
}

/* 의학 용어 검색 (위키백과 — 무료 API) */
const MED_ABBR = {
  'jt':'joint','jts':'joints','sc':'sternoclavicular','scj':'sternoclavicular',
  'ac':'acromioclavicular','si':'sacroiliac','tmj':'temporomandibular','cmc':'carpometacarpal',
  'mcp':'metacarpophalangeal','pip':'proximal interphalangeal','dip':'distal interphalangeal','mtp':'metatarsophalangeal',
  'acl':'anterior cruciate ligament','pcl':'posterior cruciate ligament','mcl':'medial collateral ligament','lcl':'lateral collateral ligament',
  'atfl':'anterior talofibular ligament','cfl':'calcaneofibular ligament',
  'itb':'iliotibial band','oa':'osteoarthritis','ra':'rheumatoid arthritis',
  'fx':'fracture','c-spine':'cervical spine','t-spine':'thoracic spine','l-spine':'lumbar spine','rom':'range of motion'
};
function medExpand(q){
  const low = q.toLowerCase();
  const out = low.replace(/[a-z가-힣-]+/g, w => (MED_ABBR[w] !== undefined ? MED_ABBR[w] : w));
  return {q: out, expanded: out !== low};
}
async function medSearch(raw){
  const q0 = raw.trim(); if(!q0) return;
  const ex = medExpand(q0); const q = ex.q;
  let modal = document.getElementById('medModal');
  if (!modal){
    modal = document.createElement('div'); modal.id = 'medModal';
    modal.innerHTML = `<div class="ms-pop"><button class="ms-x" data-msx aria-label="닫기">✕</button><div class="ms-pop-body" id="medOut"></div></div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-msx]')) modal.classList.remove('on'); });
  }
  modal.classList.add('on');
  const out = document.getElementById('medOut');
  out.innerHTML = '<p class="ms-loading">검색 중…</p>';
  const head = ex.expanded ? `<p class="ms-interp">「${q0}」→ 의학 용어로 해석: <b>${q}</b></p>` : '';
  const wikiURL = (lang, term) => `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrlimit=1&prop=pageimages|extracts&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=520&callback=`;
  const run = (lang, term) => new Promise(res => {
    const name = 'mscb' + Math.random().toString(36).slice(2);
    const done = j => { clearTimeout(timer); delete window[name]; const pages = j && j.query && j.query.pages; res(pages && pages.length ? {...pages[0], lang} : null); };
    const timer = setTimeout(() => { delete window[name]; res(null); }, 6000);
    window[name] = done;
    const sc = document.createElement('script');
    sc.onerror = () => { clearTimeout(timer); delete window[name]; res(null); };
    sc.src = wikiURL(lang, term) + name;
    document.head.appendChild(sc);
  });
  const fetchRun = async (lang, term) => {
    try { const r = await fetch(wikiURL(lang, term).replace('&callback=','')); const j = await r.json(); const p = j.query && j.query.pages; return (p && p.length) ? {...p[0], lang} : null; }
    catch(e){ return null; }
  };
  try {
    let hit = null;
    const langs = ex.expanded ? ['en','ko'] : ['ko','en'];
    for (const term of (ex.expanded ? [q, q0] : [q0])){
      for (const lang of langs){
        hit = await fetchRun(lang, term) || await run(lang, term);
        if (hit && (lang==='en' || hit.thumbnail)) break;
      }
      if (hit) break;
    }
    if (hit && !hit.thumbnail){
      try {
        const ll = await fetch(`https://ko.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&titles=${encodeURIComponent(hit.title)}&prop=langlinks&lllang=en`);
        const lj = await ll.json();
        const enT = lj.query && lj.query.pages && lj.query.pages[0] && lj.query.pages[0].langlinks && lj.query.pages[0].langlinks[0] && lj.query.pages[0].langlinks[0]['*'];
        if (enT){ const eh = await fetchRun('en', enT); if (eh && eh.thumbnail) hit = {title:hit.title, extract:hit.extract, lang:'ko', thumbnail:eh.thumbnail}; }
      } catch(e){}
    }
    if (!hit){
      out.innerHTML = head + `<div class="ms-card"><p class="ms-none">문서 뷰어에서 외부 검색이 차단되었습니다. 아래 버튼으로 새 창에서 확인해 주세요.</p><a class="ms-link" href="https://ko.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">새 창에서 「${q}」 검색 결과 열기 ↗</a></div>`;
      return;
    }
    const link = `https://${hit.lang}.wikipedia.org/wiki/${encodeURIComponent(hit.title.replace(/ /g,'_'))}`;
    let koName = '';
    if (hit.lang === 'en'){
      try {
        const ll = await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&titles=${encodeURIComponent(hit.title)}&prop=langlinks&lllang=ko`);
        const lj = await ll.json();
        const koT = lj.query && lj.query.pages && lj.query.pages[0] && lj.query.pages[0].langlinks && lj.query.pages[0].langlinks[0] && lj.query.pages[0].langlinks[0]['*'];
        if (koT) koName = `<span>한국어: ${koT}</span>`;
      } catch(e){}
    }
    out.innerHTML = head + `<div class="ms-card"><div class="ms-head"><b>${hit.title}</b>${koName}<span>${hit.lang==='ko'?'위키백과(한국어)':'Wikipedia (English)'}</span></div><p class="ms-ext">${(hit.extract||'설명이 없습니다.').slice(0,600)}</p>${hit.thumbnail?`<figure class="ms-fig"><img src="${hit.thumbnail.source}" alt="${hit.title}"><figcaption>${hit.title} — 관련 이미지</figcaption></figure>`:'<p class="ms-noimg">이 용어의 이미지가 없습니다.</p>'}<a class="ms-link" href="${link}" target="_blank" rel="noopener noreferrer">위키백과에서 더 보기 ↗</a></div>`;
  const figImg = out.querySelector('.ms-fig img');
  if (figImg) figImg.addEventListener('error', () => { const f2 = figImg.closest('.ms-fig'); if (f2) f2.outerHTML = '<p class="ms-noimg">이미지를 불러올 수 없습니다.</p>'; });
  } catch(err){ out.innerHTML = head + `<div class="ms-card"><p class="ms-none">검색에 실패했습니다 — 네트워크를 확인해 주세요.</p><a class="ms-link" href="https://ko.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">새 창에서 「${q}」 검색 결과 열기 ↗</a></div>`; }
}
document.addEventListener('click', e=>{
  if (e.target.id === 'medGo'){ const q = document.getElementById('medQ').value.trim(); if(q) medSearch(q); }
});
document.addEventListener('keydown', e=>{
  if (e.key === 'Enter' && e.target.id === 'medQ'){ const q = e.target.value.trim(); if(q) medSearch(q); }
  if (e.key === 'Escape' && document.getElementById('medModal')) document.getElementById('medModal').classList.remove('on');
});

/* 이벤트: 카드 클릭 / 양식 칩 / 뒤로가기 / ESC / 해시 변경 */
document.addEventListener('click', e=>{
  const pb = e.target.closest('[data-pshot]');
  if (pb){ window._single=[{src:pb.dataset.pshot, t:pb.dataset.pt||'제품 사진'}]; openShot(0); return; }
  const shb = e.target.closest('[data-shot]');
  if (shb){ window._single=null; openShot(+shb.dataset.shot); return; }
  const ck = e.target.closest('[data-check]');
  if (ck){ toggleCheck(ck); return; }
  const jp = e.target.closest('[data-jump]');
  if (jp){ const el = document.getElementById(jp.dataset.jump); if (el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 70, behavior:'smooth'}); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav){ location.hash = nav.dataset.nav; return; }
  const t = e.target.closest('[data-toast]');
  if (t){
    $toast.textContent = '양식 파일은 간호팀 공용 폴더에서 받을 수 있어요.';
    $toast.classList.add('show');
    clearTimeout($toast._t);
    $toast._t = setTimeout(()=>$toast.classList.remove('show'), 2200);
  }
});
const $q = document.getElementById('q'), $pop = document.getElementById('searchPop');
let _sel = 0, _res = [];
function drawSearch(){
  const q=$q.value.trim(); if(!q){ $pop.hidden=true; return; }
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  _res=runSearch(q); _sel=Math.min(_sel,Math.max(0,_res.length-1));
  $pop.innerHTML = _res.length ? `<div class="sr-head">검색 결과 ${_res.length}${_res.length===40?'+':''}건</div>` + _res.map((r,i)=>`<button class="sr${i===_sel?' on':''}" data-sr="${i}">
      <span class="sr-t">${hl(r.t,terms)}</span>${r.p?`<span class="sr-p">${r.kind} · ${hl(r.p,terms)}</span>`:`<span class="sr-p">${r.kind}</span>`}${r.b?`<span class="sr-s">${hl(snippet(r.b,terms),terms)}</span>`:''}
    </button>`).join('') : `<div class="sr-empty">‘${hl(q,[])}’에 대한 검색 결과가 없어요.</div>`;
  $pop.hidden=false;
}
function goSearch(i){ const r=_res[i]; if(!r) return; $pop.hidden=true; $q.blur(); window._hlTerms = $q.value.trim().split(/\s+/).filter(Boolean); if(location.hash===r.h) render(); else location.hash=r.h; }
$q.addEventListener('input', ()=>{ _sel=0; drawSearch(); });
$q.addEventListener('focus', drawSearch);
$q.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); _sel=Math.min(_sel+1,_res.length-1); drawSearch(); const on=$pop.querySelector('.sr.on'); if(on) $pop.scrollTop=on.offsetTop-$pop.clientHeight/2; }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _sel=Math.max(_sel-1,0); drawSearch(); const on=$pop.querySelector('.sr.on'); if(on) $pop.scrollTop=on.offsetTop-$pop.clientHeight/2; }
  else if(e.key==='Enter'){ e.preventDefault(); goSearch(_sel); }
  else if(e.key==='Escape'){ $q.value=''; $pop.hidden=true; $q.blur(); e.stopPropagation(); }
});
$pop.addEventListener('mousedown', e=>{ const b=e.target.closest('[data-sr]'); if(b){ e.preventDefault(); goSearch(+b.dataset.sr); } });
document.addEventListener('mousedown', e=>{ if(!e.target.closest('#search')) $pop.hidden=true; });
document.addEventListener('keydown', e=>{ if(e.key==='/' && document.activeElement!==$q && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); $q.focus(); $q.select(); } });

$back.addEventListener('click', ()=>{
  const ids = parseHash(); ids.pop();
  location.hash = ids.length ? '/'+ids.join('/') : '/';
});
document.addEventListener('keydown', e=>{
  const ck = e.target.closest && e.target.closest('[data-check]');
  if (ck && (e.key===' '||e.key==='Enter')){ e.preventDefault(); toggleCheck(ck); return; }
  if (e.key === 'Escape' && document.activeElement !== $q && parseHash().length) $back.click();
});
window.addEventListener('hashchange', render);

/* ── 의학용어 검색 팝업 + 의학용어 전용 필터 ── */
const MED_CATS = ['의학','해부학','생리학','병리학','약리학','질병','질환','증후군','약물','약학','약제','처방','치의학','간호학','임상','응급의학','외과','내과','정형외과','신경학','신경과','정신의학','종양','세균학','바이러스','면역학','유전학','독성학','재활','소독','감염','방사선','마취','소아','산부인과','이비인후','안과','피부과','비뇨의학','흉부외과','신장','심장','폐','소화기','내분비','호르몬','뼈','근골격','관절','근육','인체','건강','수술','항생제','백신','염증','외상','골절'];
const MED_SUFFIX = /(근육|신경|골절|증후군|부전|궤양|염증|종양|질환|항생제|백신)$/;
let _medCtrl = null;
function medModalEl(){ return document.getElementById('medModal'); }
function openMedModal(q){
  const m = medModalEl(); if(!m) return;
  if(q) document.getElementById('medQm').value = q;
  m.hidden = false;
  if(q && q.trim()) runMedPopup(q.trim());
  const inp = document.getElementById('medQm'); if(inp) inp.focus();
}
function closeMedModal(){
  const m = medModalEl(); if(!m) return;
  m.hidden = true;
  if(_medCtrl) _medCtrl.abort();
}
async function runMedPopup(q){
  const mres = document.getElementById('medResults'); if(!mres) return;
  if(!q){ mres.hidden = true; mres.innerHTML = ''; return; }
  if(_medCtrl) _medCtrl.abort();
  _medCtrl = new AbortController();
  mres.hidden = false;
  mres.innerHTML = '<div class="ms-state">위키백과에서 &lsquo;' + hl(q,[]) + '&rsquo; 의학용어를 찾는 중이에요&hellip;</div>';
  try{
    const sUrl = 'https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=14&srprop=size&srsearch=' + encodeURIComponent(q);
    const sr = await fetch(sUrl, {signal:_medCtrl.signal}).then(r=>r.json());
    const hits = (sr.query && sr.query.search) || [];
    const none = '<div class="ms-state">&lsquo;' + hl(q,[]) + '&rsquo;에 해당하는 의학용어를 위키백과에서 찾지 못했어요.<br>병명·해부학 용어·약품명으로 다시 검색해 보세요.</div>';
    if(!hits.length){ mres.innerHTML = none; return; }
    const dUrl = 'https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts%7Clanglinks%7Cpageimages%7Ccategories&exintro=1&explaintext=1&exlimit=14&lllimit=max&pithumbsize=140&cllimit=max&pageids=' + hits.map(h=>h.pageid).join('%7C');
    const dr = await fetch(dUrl, {signal:_medCtrl.signal}).then(r=>r.json());
    const order = new Map(hits.map((h,i)=>[h.pageid, i]));
    const pages = (dr.query ? Object.values(dr.query.pages || {}) : [])
      .sort((a,b)=>((order.get(a.pageid) ?? 99) - (order.get(b.pageid) ?? 99)));
    const isMed = p => {
      if(MED_SUFFIX.test(p.title || '')) return true;
      return (p.categories || []).some(c => MED_CATS.some(k => (c.title || '').includes(k)));
    };
    const med = pages.filter(isMed).slice(0, 6);
    if(!med.length){ mres.innerHTML = none; return; }
    mres.innerHTML = med.map(p=>{
      const en = ((p.langlinks||[]).find(l=>l.lang==='en')||{})['*'] || '';
      const full = (p.extract||'').replace(/\s+/g,' ');
      const ex = full.slice(0,110);
      const th = p.thumbnail && p.thumbnail.source;
      const url = 'https://ko.wikipedia.org/wiki/' + encodeURIComponent((p.title||'').replace(/ /g,'_'));
      return '<a class="ms-item" href="' + url + '" target="_blank" rel="noopener">'
        + (th ? '<img class="ms-thumb" src="' + th + '" alt="" loading="lazy">' : '<span class="ms-noimg">+</span>')
        + '<span class="ms-main"><span class="ms-t">' + hl(p.title||'',[]) + (en ? '<em class="ms-en">' + hl(en,[]) + '</em>' : '') + '</span>'
        + (ex ? '<span class="ms-x">' + hl(ex,[]) + (full.length>110 ? '&hellip;' : '') + '</span>' : '')
        + '</span></a>';
    }).join('');
  }catch(err){
    if(err && err.name==='AbortError') return;
    mres.innerHTML = '<div class="ms-state">지금은 위키백과에 연결할 수 없어요. 네트워크 연결 후 다시 시도해 주세요.</div>';
  }
}
/* 카드의 검색 버튼·Enter를 가로채 팝업으로 연결(기존 인라인 결과 대체) */
document.addEventListener('click', e=>{
  if(!e.target.closest) return;
  if(e.target.closest('#medGo')){ e.preventDefault(); e.stopImmediatePropagation(); const q = document.getElementById('medQ').value.trim(); if(q) openMedModal(q); return; }
  if(e.target.closest('#medGo2')){ runMedPopup(document.getElementById('medQm').value.trim()); return; }
  if(e.target.closest('[data-msclose]')){ closeMedModal(); return; }
}, true);
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && e.target.id==='medQ'){ e.preventDefault(); e.stopImmediatePropagation(); const q = e.target.value.trim(); if(q) openMedModal(q); }
  else if(e.key==='Enter' && e.target && e.target.id==='medQm'){ e.preventDefault(); runMedPopup(e.target.value.trim()); }
  else if(e.key==='Escape' && medModalEl() && !medModalEl().hidden){ e.stopImmediatePropagation(); closeMedModal(); }
}, true);
/* 열기: #/경로 해시 지원 */
render();
</script>
