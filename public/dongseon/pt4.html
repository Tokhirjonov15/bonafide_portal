<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>4층 비급여 예약</title>
<!--
  4층 비급여 치료 예약 스케줄 (2026-10-07: visit-stats(Vercel, Next.js + Neon) 를 포털로 옮김)
  · 화면: 일별 스케줄 / 간단 모드 / 내원률 통계 / 치료 통계 / 그래프 / 변경 기록 / 가져오기 — visit-stats 와 같은 규칙
  · 로그인: 동선관리와 같은 직원 계정(Firebase). 직원 전원 편집, 누가 고쳤는지는 변경 기록에 이름으로
  · 데이터: Firestore pt4Day/{YYYY-MM-DD} (하루치 한 문서: 치료사 순서·예약·비근무/차단·취소/변경·Manual Tx·특이사항),
            pt4Meta/main (치료사 명단·당월 누적 상담수·데이터 있는 날), pt4Audit (변경 기록)
  · 구글 시트 사본은 쓰지 않는다 (2026-10-07 결정 — 포털이 원본)
-->
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#e6e8eb;--muted:#9aa3ad;--line:#2a2f37;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;padding:16px 12px}
body.embed{padding:8px}
.card{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card.full{max-width:none}
h1{font-size:22px;margin:0 0 12px}
.who{color:var(--muted);font-size:14px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-size:13px}
button.danger{color:#dc2626}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
.err{color:#dc2626}
.info{color:#16a34a;font-weight:600}
.imp-mode{display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:8px;border:1px solid #d0d7de;border-radius:6px}
.imp-mode label{cursor:pointer}
.imp-mode .list{margin:0 0 0 22px}
table.imp-skip{border-collapse:collapse;margin:8px 0;font-size:12px}table.imp-skip th,table.imp-skip td{border:1px solid #d0d7de;padding:3px 8px;text-align:left}
.note{color:var(--muted);font-size:13px;margin-top:14px}
a{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.scroll{overflow-x:auto}
td.muted{color:var(--muted)}
tfoot td{border-top:2px solid var(--line);border-bottom:0}
table.plain th:not(:first-child),table.plain td:not(:first-child){text-align:right;white-space:nowrap}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.nav nav{display:flex;gap:4px;flex-wrap:wrap}
.nav nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);border:1px solid transparent;font-size:14px}
.nav nav a.on{color:var(--text);border-color:var(--line);background:var(--bg);font-weight:700}
.daybar{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 8px;flex-wrap:wrap}
.daybar h1{margin:0}
.pill{padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--text);font-size:14px;background:transparent;cursor:pointer;font-family:inherit}
.pill.small{font-size:12px;padding:4px 8px}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.days{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:12px}
.days .day{width:32px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;text-decoration:none;color:var(--muted);font-size:13px;border:1px solid transparent}
.days .day.on{color:#fff;background:var(--accent)}
.days .day.has{color:var(--text);font-weight:600}
.days .day:hover{border-color:var(--line)}
.jump{display:flex;gap:6px;align-items:center;margin-left:8px}
.jump select,.jump input{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row.wrap{flex-wrap:wrap}
.row input{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
.row input[type=date]{flex:none}
.hint{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;margin-bottom:8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.hint .row{margin:0}
/* 표 */
table.sheet{table-layout:fixed;border-collapse:collapse;color:#1f2328;font-size:11px;line-height:1.15;margin-top:0}
table.sheet td{border:1px solid #c8ccd2;padding:0 2px;overflow:hidden;white-space:pre-line;vertical-align:middle}
table.sheet td.editable{cursor:pointer}
table.sheet td.editable:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.grid{font-size:11px;table-layout:fixed}
table.grid th{background:var(--bg);color:var(--text);text-align:center;padding:6px 4px;border:1px solid #c8ccd2}
table.grid th.th-name{cursor:pointer;font-weight:700;color:#1f2328}
table.grid td{border:1px solid #d5d8de;padding:0 2px;vertical-align:middle;color:#1f2328;background:#fff}
table.grid tr.quarter td{border-top:1px dashed #e6e8ec}
table.grid td.time{background:var(--bg);color:var(--text);text-align:center;font-weight:600;font-size:12px}
table.grid td.free{background:#fff}
table.grid td.free.editable:hover{background:#eef4ff}
table.grid td.pt{white-space:pre-line;line-height:1.15;text-align:center;position:relative;overflow:visible}
table.grid td.code{text-align:center}
table.grid td.mark{text-align:center;font-weight:700}
table.grid td.block{text-align:center;color:#333}
table.grid td.center{text-align:center}
table.grid tfoot td{background:var(--bg);color:var(--text);font-weight:600}
table.grid tfoot td.time{font-size:11px}
table.grid tbody tr{height:18px}
table.grid td.single{font-size:10px}
table.grid td.band{text-align:center;font-weight:600;color:#333;letter-spacing:2px}
table.grid th.section{background:#ffebeb;color:#1f2328;font-weight:700}
table.grid th.cancel-section{background:#d9d2e9}
table.grid th.th-cancel{background:#f3f4f6;color:#1f2328;font-size:11px}
table.grid td.cancel{font-size:11px;line-height:1.1;white-space:pre-line;text-align:center}
table.grid td.cancel.strike{text-decoration:line-through;color:#555}
table.grid td.cancel.free.editable:hover{background:#eef4ff}
table.grid td.big{font-size:15px;font-weight:700}
table.grid td.ratio{background:#d9ead3!important;color:#1f2328}
table.grid.fluid{min-width:720px}
table.grid.fluid td.pt{font-size:clamp(10px,.75vw,13px)}
table.grid.fluid td.code{font-size:clamp(10px,.7vw,12px)}
table.grid td.mark.editing{padding:0}
table.grid td.mark input{width:100%;height:100%;border:2px solid var(--accent);border-radius:2px;font:inherit;font-size:11px;text-align:center;padding:0;background:#fff;color:#1f2328}
input.consult{width:44px;text-align:center;font:inherit;border:1px solid var(--line);border-radius:4px;background:#fff;color:#1f2328}
.cancel-wrap{margin-top:14px}
/* 메모 말풍선 */
#selBox{position:fixed;display:none;pointer-events:none;z-index:40;border:2px solid #2563eb;background:rgba(37,99,235,.10);border-radius:3px}   /* 드래그 범위 */
@keyframes dueBlink{0%,100%{background-color:#fecaca;box-shadow:inset 0 0 0 2px #ef4444}50%{background-color:#fee2e2;box-shadow:inset 0 0 0 1px #fca5a5}}
table.grid td.due{animation:dueBlink 1.8s ease-in-out infinite;color:#991b1b!important;font-weight:700}   /* 치료 시간이 지났는데 아직 점(.)이 안 찍힘 (2026-10-07) */
table.grid td .tx-end{font-size:10px;font-weight:700;color:#b45309;line-height:1.1}   /* 치료 끝나는 시각 */
.man-src{display:inline-block;margin-left:3px;padding:0 4px;border-radius:4px;font-size:10px;font-weight:700;vertical-align:1px}.man-src.b{background:#dbeafe;color:#1d4ed8}.man-src.s{background:#fee2e2;color:#b91c1c}   /* Manual Tx 줄 출처 (2026-10-11) */
.man-hid{margin-top:4px;font-size:12px}.man-hid ul{margin:4px 0 0;padding-left:4px;list-style:none}.man-hid li{padding:2px 0}.man-hid button{padding:1px 6px;font-size:11.5px}   /* 숨긴 자동 줄 (2026-10-11) */
.np-x{padding:0 6px!important;font-size:12px!important;color:#b91c1c;border-color:transparent!important;margin-right:2px}   /* 1회차 목록에서 지우기 (2026-10-10) */
.np-list li{position:relative}.np-list .np-who .np-x{position:absolute;top:4px;right:4px;font-size:15px!important;padding:2px 8px!important;border:1px solid #fca5a5!important;background:#fff;border-radius:6px}   /* 카드 오른쪽 위 ✕ (2026-10-11 요청) */
.np-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:999px;margin-left:8px;font-size:13px}.np-chip button{padding:3px 10px;font-size:12px}   /* 처방 나온 첫 방문 환자 */
.pt-info-btn{background:#eff6ff;color:#1d4ed8;border:2px solid #93c5fd;font-weight:700;font-size:15px;padding:9px 20px;border-radius:10px}.pt-info-btn:hover{background:#dbeafe}   /* 예약 창의 [환자 정보] — 잘 보이게 */
.np-list{margin-top:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}.np-list li{background:var(--card)}.np-who{margin-bottom:4px}   /* 처방 나온 1회차 — 예전 기록 카드 */
.cp-row select,.cp-row input[type=date]{font:inherit;font-size:13px;padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
table.grid td.sel{box-shadow:inset 0 0 0 2px #2563eb;filter:brightness(.93)}   /* 복사하려고 고른 예약 */
table.grid:not(.cancel-grid){user-select:none;-webkit-user-select:none}
table.grid .note-pop,table.grid .note-pop textarea{user-select:text;-webkit-user-select:text}
table.grid td.pt.has-note::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #1f2328 transparent transparent}
.note-pop{display:block;visibility:hidden;opacity:0;transition:opacity .15s ease,visibility 0s linear .45s;position:absolute;top:0;left:100%;z-index:20;width:400px;margin-left:4px;background:#fffbe6;color:#1f2328;border:1px solid #c9b458;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:8px;text-align:left;font-weight:400;font-size:12px;cursor:default;white-space:normal}
table.grid td.pt:hover .note-pop,table.grid td.pt:focus-within .note-pop,table.manual td.name-cell:hover .note-pop,table.manual td.name-cell:focus-within .note-pop{visibility:visible;opacity:1;transition-delay:.45s}
.note-pop.fixed{position:fixed;margin:0;width:400px;z-index:60}   /* 스크롤 칸 밖으로도 보이게 — 화면 기준 위치 (2026-10-07) */
.note-head{font-weight:700;margin-bottom:4px}
.note-pop textarea{width:100%;min-height:260px;font:inherit;font-size:13px;line-height:1.45;padding:6px;border:1px solid #d6c98a;border-radius:4px;background:#fff;color:#1f2328;resize:vertical}
.note-foot{margin-top:4px}
.note-text{white-space:pre-line;margin:0}
/* 시트형 배치 */
.sheet-layout{display:flex;gap:12px;align-items:flex-start}
.sheet-layout:focus{outline:none}
.sheet-main{flex:1;min-width:0}
.sheet-title{display:flex;justify-content:space-between;align-items:center;background:#cfe2f3;color:#1f2328;border:1px solid #c8ccd2;border-bottom:0;padding:6px 12px}
.sheet-title-text{font-size:20px;font-weight:800;letter-spacing:1px;margin:0 auto}
.sheet-title-date{font-size:18px;font-weight:800}
.sheet-side{display:flex;flex-direction:row;gap:10px;align-items:flex-start}
.side-col{width:300px;display:flex;flex-direction:column;gap:10px}
.side-col:last-child{width:330px}
@media (max-width:1500px){.sheet-layout{flex-wrap:wrap}.sheet-side{width:100%}}
@media (max-width:700px){.sheet-side{flex-direction:column}.side-col,.side-col:last-child{width:100%}}
@media (min-width:701px){.sheet-side{zoom:.8}}   /* 오른쪽 두 칸(검색·달력·특이사항 / Manual Tx) 20% 작게 (2026-10-11 요청) */
.panel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel h2{font-size:15px;margin:0 0 8px}
.panel textarea{width:100%;font:inherit;font-size:14px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.panel.cal{padding:8px 10px}
.cal-head{text-align:center;font-weight:700;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px;text-align:center}
.cal-dow{color:var(--muted);font-size:11px}
.cal-day{display:block;padding:4px 0;border-radius:4px;text-decoration:none;color:var(--muted)}
.cal-day.has{color:var(--text);font-weight:600}
.cal-day.today{outline:2px solid #f97316;outline-offset:-2px}
.cal-day.on{background:var(--accent);color:#fff}
.cal-day:hover{background:var(--bg)}
.sun{color:#dc2626!important}.sat{color:#2563eb!important}
.cal-day.on.sun,.cal-day.on.sat{color:#fff!important}
.panel.legend{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.panel.legend button.legend-row{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;color:var(--text);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.panel.legend button.legend-row.on{border-color:var(--accent);background:var(--bg);font-weight:700}
.panel.legend.painting{outline:2px solid var(--accent)}
.legend-swatch{width:28px;height:14px;border:1px solid #b8bcc4;border-radius:3px;flex:none}
.legend-hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:4px}
.sheet-layout.painting table.grid td.editable{cursor:crosshair}
.special{color:#2563eb;font-weight:700;font-size:15px;white-space:pre-line;text-align:center;margin:8px 0 0}
.list{list-style:none;padding:0;margin:0}
.list.search li{display:block;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:4px}
.search-row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}
.search-row button{white-space:nowrap;font-size:11px;line-height:1.2}
.search-note{white-space:pre-line;color:var(--muted);font-size:11px;margin-top:2px;max-height:60px;overflow:auto}
.small{font-size:12px;color:var(--muted)}
.nowrap{white-space:nowrap}
table.mini{width:100%;font-size:13px;margin-top:6px}
table.mini th,table.mini td{padding:4px 6px}
/* Manual Tx */
.manual-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:6px}
table.manual{margin-top:0}
table.manual th{position:sticky;top:0;background:var(--bg);z-index:1}
table.manual th,table.manual td{padding:3px 4px;font-size:12px}
table.manual td{color:var(--text)}
table.manual tr.colored td{color:#1f2328}
table.manual tr.blank td{height:22px}
table.manual tr.blank.editable{cursor:pointer}
table.manual tr.blank.editable:hover td{background:#eef4ff;color:#1f2328}
table.manual tr.editing-row td{padding:2px}
table.manual tr.editing-row input{width:100%;font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--accent);border-radius:4px;background:#fff;color:#1f2328}
table.manual td.name-cell{position:relative;overflow:visible}
table.grid td.cancel.cx-cell{position:relative}
table.grid td.cancel.has-note::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #1f2328 transparent transparent}
table.grid td.cx-cell:hover .note-pop,table.grid td.cx-cell:focus-within .note-pop{visibility:visible;opacity:1;transition-delay:.45s}
table.grid td.cx-cell .note-pop{text-decoration:none;text-align:left;font-weight:normal}
table.manual td.name-cell.has-note::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent #1f2328 transparent transparent}
table.manual td.name-cell .note-pop{left:auto;right:100%;margin-left:0;margin-right:4px}
table.manual tr.paintable{cursor:crosshair}
table.manual td.nowrap{position:relative;white-space:nowrap;width:48px}
table.manual .ed{cursor:text}
.swatch{width:26px;height:26px;border-radius:6px;border:1px solid #b8bcc4;padding:0;cursor:pointer}
.swatch.on{outline:3px solid var(--accent);outline-offset:1px}
.swatch.tiny{width:18px;height:18px;border-radius:3px;border:1px solid #8a8f98;vertical-align:middle;margin-right:3px}
.swatch-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0}
.swatch-row .who{min-width:72px}
.swatch-row.pop{position:absolute;right:0;top:100%;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;width:220px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
button.icon{padding:2px 6px;font-size:12px;line-height:1}
table.manual-count{margin-top:10px}
table.manual-count td.hit{background:#d9ead3;color:#1f2328;font-weight:700}
table.manual-count td.no{color:var(--muted);width:28px;text-align:right}
table.manual-count tr.sum td{font-weight:700}
table.summary td.lbl{font-weight:700;color:#1f2328}
table.summary td.lbl.green{background:#6aa84f}
table.summary td.lbl.blue{background:#a4c2f4}
table.summary td:last-child{font-weight:700;text-align:center}
/* 입력창 */
#editor{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;width:min(720px,calc(100vw - 24px));max-height:80vh;overflow:auto}
#editor:empty{display:none}
.editor{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.editor-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 12px;margin:8px 0}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form-grid label.wide{grid-column:1/-1}
.form-grid textarea.ed-note{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical;line-height:1.45}   /* 예약 메모 — 여러 줄 (2026-10-07: 한 줄 칸이라 저장하면 줄바꿈이 사라졌다) */
.form-grid input,.form-grid select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
label.check{display:flex;align-items:center;gap:8px;margin:8px 0}
label.check.small{font-size:12px;margin:0;gap:4px}
.th-list{list-style:decimal;padding-left:24px;margin:8px 0}
.th-list li{display:flex;gap:6px;align-items:center;padding:4px 0}
.th-list li span{flex:1}
/* 통계 */
.h2{font-size:18px;margin:22px 0 8px}
.code-tables{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
table.codes{border-collapse:collapse;font-size:11px;width:auto;table-layout:auto;margin-top:6px}
table.codes th,table.codes td{border:1px solid #c8ccd2;padding:1px 4px;text-align:center;white-space:nowrap}
table.codes th{background:var(--bg)}
table.codes th.grp,table.codes td.grp{width:36px;font-size:13px;background:#d9ead3;color:#1f2328}
table.codes tr.sum th{background:#d9ead3;color:#1f2328}
table.codes td.code{text-align:left;font-weight:700;padding-right:8px}
table.codes td{color:var(--muted)}
table.codes td.hit{background:#d9ead3;color:#1f2328;font-weight:600}
table.codes tr.nz td.code{color:var(--text)}
.day-details{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:6px}
.day-details summary{cursor:pointer;display:flex;gap:8px;align-items:center}
/* 그래프 */
:root{--viz-series:#2a78d6;--viz-grid:#e5e7eb;--viz-axis:#9aa3ad;--viz-text:#52514e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--viz-series:#3987e5;--viz-grid:#2a2f37;--viz-axis:#6b7280;--viz-text:#c3c2b7}}
.viz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
figure.viz{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
figure.viz figcaption{font-size:13px;font-weight:700;margin-bottom:4px}
figure.viz svg{width:100%;height:auto;display:block}
figure.viz .grid{stroke:var(--viz-grid);stroke-width:1}
figure.viz .axis{stroke:var(--viz-axis);stroke-width:1}
figure.viz .tick{font-size:9px;fill:var(--viz-text)}
figure.viz .val{font-size:9px;fill:var(--text);font-weight:600}
figure.viz .bar{fill:var(--viz-series)}
figure.viz .bar.s1{fill:#2a78d6}figure.viz .bar.s3{fill:#1baf7a}
figure.viz .line{fill:none;stroke:var(--viz-series);stroke-width:2;stroke-linejoin:round}
figure.viz .dot{fill:var(--viz-series);stroke:var(--card);stroke-width:2}
.legend-inline{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px}
.legend-inline .sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-left:8px}
.legend-inline .sw.s1{background:#2a78d6}.legend-inline .sw.s3{background:#1baf7a}
/* 간단 모드 */
.mob{max-width:560px;margin:0 auto}
.mob-head{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);padding:6px 0;z-index:5}
.mob-nav{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);background:transparent;padding:0}
.mob-date{flex:1;text-align:center}
.mob-date input{font:inherit;font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.mob-label{font-size:13px;color:var(--muted);margin-top:2px}
.mob-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.chip.on{border-color:var(--accent);font-weight:700}
.chip-n{font-size:11px;color:var(--muted);margin-left:2px}
.mob-list{display:flex;flex-direction:column;gap:4px}
.mob-row{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;min-height:48px;overflow:hidden}
.mob-row.free{border-style:dashed;cursor:pointer}
.mob-row.block.off{background:#999;color:#222}
.mob-row.block.memo{color:#222}
.mob-row.booking{color:#1f2328;background:#fff}
.mob-time{flex:none;width:64px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;font-size:14px;border-right:1px solid rgba(0,0,0,.08)}
.mob-time span{font-weight:400;font-size:11px;opacity:.7}
.mob-body{flex:1;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;font-size:15px}
.mob-body.muted{color:var(--muted);font-size:13px}
.mob-name strong{font-size:16px}
.mob-sub{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:2px}
.mob-sub .code{padding:1px 6px;border-radius:4px;border:1px solid rgba(0,0,0,.1)}
.mob-note{color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.mob-visit{flex:none;width:52px;border:0;border-left:1px solid rgba(0,0,0,.08);background:transparent;color:#666;font-size:20px;border-radius:0}
.mob-visit.on{color:#16a34a;font-weight:700}
.mob-form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.mob-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mob-form label.wide{grid-column:1/-1}
.mob-form input,.mob-form select,.mob-form textarea{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
/* 로그인·알림 */
#login{max-width:380px;margin:60px auto}
#login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
#login input{font:inherit;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast:empty{display:none}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:600px){.nav nav a{padding:6px 8px;font-size:13px}.card{padding:12px}body{padding:8px}}
</style>

<script>
'use strict';
/* ═════════ 설정 ═════════ */
const FB_CONFIG={apiKey:"AIzaSyDBj3z-Qj9DyT1ZgDNps1-Yp9ZBopeWr0w",authDomain:"bonafide-dongseon-108e2.firebaseapp.com",projectId:"bonafide-dongseon-108e2",
  storageBucket:"bonafide-dongseon-108e2.firebasestorage.app",messagingSenderId:"461032988752",appId:"1:461032988752:web:8fa4b34e7ac5526411f155"};

/* ═════════ 시간 (visit-stats lib/time.ts) ═════════ */
const DAY_START=540, SLOT=15, SLOTS=48, DAY_END=DAY_START+SLOT*SLOTS, SHORT_END=18*60;
const TIMES=Array.from({length:SLOTS},(_,i)=>DAY_START+i*SLOT);

const WEEKDAYS=['일','월','화','수','목','금','토'];
/* 공휴일 (주말과 함께 17:30 칸까지). 해가 바뀌면 추가 */
const HOLIDAYS=new Set(["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-01","2026-03-02","2026-05-01","2026-05-05","2026-05-24","2026-05-25",
  "2026-06-03","2026-06-06","2026-08-15","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-05","2026-10-09","2026-12-25","2027-01-01"]);
const pad2=n=>String(n).padStart(2,'0');
const hm=m=>`${Math.floor(m/60)}:${pad2(m%60)}`;
const ymd=(y,m,d)=>`${y}-${pad2(m)}-${pad2(d)}`;
function splitYmd(s){const [y,m,d]=s.split('-').map(Number);return {year:y,month:m,day:d};}
function koreanDate(s){const {year,month,day}=splitYmd(s);return `${year}년 ${month}월 ${day}일 (${WEEKDAYS[new Date(year,month-1,day).getDay()]})`;}
function todayYmd(){const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate());}
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const isHoliday=d=>HOLIDAYS.has(d);
function isShortDay(date){const {year,month,day}=splitYmd(date);const w=new Date(year,month-1,day).getDay();return w===0||w===6||isHoliday(date);}
const dayEndMin=date=>isShortDay(date)?SHORT_END:DAY_END;
function shiftDate(date,n){const {year,month,day}=splitYmd(date);const d=new Date(year,month-1,day+n);return ymd(d.getFullYear(),d.getMonth()+1,d.getDate());}
const isValidDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const {year,month,day}=splitYmd(s);const d=new Date(year,month-1,day);return d.getFullYear()===year&&d.getMonth()===month-1&&d.getDate()===day;};
const ymOf=date=>date.slice(0,7);

/* ═════════ 색·코드 (lib/palette.ts · lib/treatment-codes.ts) ═════════ */
const PALETTE=[{hex:"#ffffff",label:"없음 (원래대로)"},{hex:"#ffff00",label:"임시치료실"},{hex:"#ff0000",label:"치료실 없음"},{hex:"#00ff00",label:"시트, 비트확인"},
  {hex:"#00ffff",label:"실손 청구여부 확인"},{hex:"#c58cff",label:"카톡친추 확인"},{hex:"#ffe599",label:"내원 (표시 .)"},{hex:"#999999",label:"비근무"}];
const LEGEND=[{hex:"#ffffff",label:"지우개 (원래대로)"}].concat(PALETTE.slice(1));
/* 이전 시트에서 쓰던 색 (2026-10-08: 코드 칸 연보라 등이 고르는 칸에 없었다 — 백업 데이터에서 많이 쓴 순). 고르기 칸에만 넣고 왼쪽 색 안내(칠하기)에는 넣지 않는다 */
const PALETTE_OLD=[{hex:"#a9abff",label:"연보라 (이전 시트 코드 색)"},{hex:"#b7e1cd",label:"연초록 (이전 시트)"},{hex:"#ead1dc",label:"연분홍 (이전 시트)"},{hex:"#d0b3ee",label:"연자주 (이전 시트)"}];
PALETTE.splice(PALETTE.length-2,0,...PALETTE_OLD);   // 내원·비근무 앞에
const HEADER_FALLBACK=["#d9d9d9","#b6e2c8","#f4c7c3","#e06666","#ffe599","#b4a7d6","#a2d5e2","#f9cb9c","#ffffff"];
const CODE_GROUPS=[
  {name:"도수",codes:["ES9","ES10","ES14","ES15","ES19","ES20","ES24","ES25","ES29","ES30","ES35","ES40","ES45","ES50","CM9","CM10","CM14","CM15","CM19","CM20","CM24","CM25","CM29","CM30","CM35","CM40","CM45","CM50",
    "CME9","CME10","CME14","CME15","CME19","CME20","CME24","CME25","CME29","CME30","CME35","CME40","CME45","CME50"]},
  {name:"충격파",codes:["EES6","EES9","EES10","EES14","EES15","EES19","EES20","EES24","EES25","EES29","EES30","EES35","EES40","EES45","EES50","CRYO10","CRYO16","CRYO20","CRYO26","CRYO30",
    "CE9","CE10","CE14","CE15","CE19","CE20","CE24","CE25","CE29","CE30","CE35","CE40","CE45","CE50"]}];
const ALL_CODES=new Set(CODE_GROUPS.flatMap(g=>g.codes));
/* 예약 창 치료코드 드롭다운 — 예전 구글 시트(8월) 치료코드 칸의 드롭다운 목록 그대로, 시트 순서 (2026-10-08 요청). MT·TMT 는 뺐다 (2026-10-10 요청) */
const CODE_LIST=["CRYO10","ES9","ES10","ES14","ES15","ES19","ES20","ES24","ES25","ES29","ES30",
  "EES6","EES9","EES10","EES14","EES15","EES19","EES20","EES24","EES25","EES29","EES30","ES35","ES40","ES45","ES50",
  "EES35","EES40","EES45","EES50","CRYO15","CRYO20","CRYO25","CRYO30","CM9","CM10","CM14","CM15","CM19","CM20","CM24","CM25","CM29","CM30","CM35","CM40","CM45","CM50",
  "CME9","CME10","CME14","CME15","CME19","CME20","CME24","CME25","CME29","CME30","CME35","CME40","CME45","CME50","CE9","CE10","CE14","CE15","CE19","CE20","CE24","CE25","CE29","CE30","CE35","CE40","CE45","CE50"];
const normalizeCode=c=>String(c||'').replace(/\s+/g,'').toUpperCase();
/* Manual Tx 건수 표에 늘 보일 이름 (stats.config.json manualTherapists, 시트 순서) */
const MANUAL_FIXED=["NULL","서효성","김지은","허빈","한상훈","조현신","이세영","황지현","김건휘","김재하","신소현","고민정","박승규","임현주"];

/* ═════════ 공통 ═════════ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=2)=>v==null?'-':`${(v*100).toFixed(d)}%`;

/* ═════════ Firebase ═════════ */
firebase.initializeApp(FB_CONFIG);
const DB=firebase.firestore();
const AUTH=firebase.auth();
const C={day:DB.collection('pt4Day'),meta:DB.collection('pt4Meta').doc('main'),audit:DB.collection('pt4Audit')};
let ME=null;   // {name,email,role}
let META={therapists:[],consults:{},dataDays:[],manualNames:{}};
let metaReady=false;

async function authEmail(name){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bonafide-auth|'+(name||'').trim().toLowerCase()));
  return 'u'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24)+'@bonafide.app';}
window.doLogin=async function(){const id=document.getElementById('lgId').value.trim(),pw=document.getElementById('lgPw').value;const m=document.getElementById('lgMsg');
  if(!id||!pw){m.textContent='아이디와 비밀번호를 넣어 주세요';return;}m.textContent='';document.getElementById('lgBtn').disabled=true;
  try{await AUTH.signInWithEmailAndPassword(await authEmail(id),pw);}catch(e){m.textContent='아이디 또는 비밀번호가 올바르지 않습니다';}
  document.getElementById('lgBtn').disabled=false;};
document.getElementById('lgPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
AUTH.onAuthStateChanged(async u=>{
  if(!u||!u.email){ME=null;document.getElementById('login').hidden=false;document.getElementById('app').hidden=true;return;}
  /* 동선관리 계정 명단(acl/main)에서 이름 — 명단에 없으면 접근 불가 (동선관리와 같은 기준) */
  let name='',role='staff',ok=false;
  try{const a=await DB.collection('acl').doc('main').get();const d=a.exists?a.data():{};const mem=(d.members||[]).find(x=>x.email===u.email);
    if(mem){name=mem.name||'';role=mem.role||'staff';ok=true;}
    if(u.email===await authEmail('admin')){name=name||'admin';role='admin';ok=true;}
    if(ok&&Array.isArray(d.boardEmails)&&role!=='admin'&&!d.boardEmails.includes(u.email))ok=false;
  }catch(e){console.warn('acl',e);}
  if(!ok){document.getElementById('lgMsg').textContent='이 계정은 접근 권한이 없습니다. 관리자에게 문의하세요.';try{await AUTH.signOut();}catch(e){}return;}
  ME={name:name||u.email,email:u.email,role,pt:false};
  myIsPt(u.email).then(v=>{ME.pt=v;if(v)safeRender();});   // 물리치료 직원 → [가져오기] 열림 (2026-10-08)
  document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
  C.meta.onSnapshot(s=>{const d=s.exists?s.data():{};
    META={therapists:Array.isArray(d.therapists)?d.therapists:[],consults:d.consults||{},dataDays:Array.isArray(d.dataDays)?d.dataDays.slice().sort():[],manualNames:d.manualNames||{},nextTid:d.nextTid||0,txMinutes:d.txMinutes||{}};
    metaReady=true;safeRender();},e=>{console.warn('meta',e);toast('설정을 읽지 못했습니다');});
  window.addEventListener('hashchange',route);route();
});
const isAdmin=()=>!!(ME&&ME.role==='admin');
/* 가져오기 = 관리자 + 물리치료 직원 (2026-10-08 요청). 물리치료 직원 = 동선관리 직원 목록(설정 staffRoster)의 '물리치료사' 파트 — 동선관리 partOf 와 같은 기준:
   명단에서 이름(한글·영문·'한글 (영문)')을 먼저 찾고, 명단에 없으면 계정의 팀. 동선관리 안에서 열렸으면 그 화면의 partOf 를 그대로 쓴다 */
const canImport=()=>isAdmin()||!!(ME&&ME.pt);
async function myIsPt(email){
  try{const a=await DB.collection('acl').doc('main').get();const mem=((a.exists?a.data():{}).members||[]).find(x=>x.email===email);if(!mem)return false;
    try{if(window.parent!==window&&typeof window.parent.partOf==='function')return window.parent.partOf(mem)==='물리치료사';}catch(e){}
    const TEAMS=['의사','물리치료사','간호사','진료지원','방사선사','행정'];const norm=x=>String(x||'').replace(/\s+/g,'').toLowerCase();
    const keys=e=>{const m=/^(.*?)\s*\((.*)\)\s*$/.exec(String(e||''));return [norm(e),m?norm(m[1]):'',m?norm(m[2]):''].filter(Boolean);};
    let ro=null;try{const c=await DB.collection('patientboard_v3').doc('반듯한정형외과').get();ro=c.exists?c.data().staffRoster:null;}catch(e){}
    const k=norm(mem.name);let part='';
    if(ro&&k){for(const g of TEAMS){if((ro[g]||[]).some(e=>keys(e).includes(k))){part=g;break;}}
      const m=/^(.*?)\((.*)\)$/.exec(k);if(!part&&m)for(const g of TEAMS){if((ro[g]||[]).some(e=>{const ks=keys(e);return ks.includes(m[1])||ks.includes(m[2]);})){part=g;break;}}}
    if(!part){const t=String(mem.team||'').trim();part=t==='간호'?'간호사':t==='방사선'?'방사선사':t==='행정실'?'행정':t;}
    return part==='물리치료사';}catch(e){console.warn('part',e);return false;}}

const thById=id=>META.therapists.find(t=>t.id===id)||null;
const activeTh=()=>META.therapists.filter(t=>t.active!==false).slice().sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)||a.name.localeCompare(b.name));
/* 하루 문서의 치료사 순서 → 치료사 정보 (전체 삭제한 치료사는 빠짐 — visit-stats 의 removeTherapist 와 같은 결과) */
/* 숨긴(퇴사) 치료사는 빼되, 그 날 그 사람 예약이 있으면 그 날만 보인다 (2026-10-08: 예전 시트의 퇴사자 환자도 가져와 보이게) */
function thOfDay(ids,bookings){const has=new Set((bookings||[]).map(b=>b.therapistId));
  return (ids||[]).map(thById).filter(t=>t&&(t.active!==false||has.has(t.id))).map(t=>({id:t.id,name:t.name,color:t.color||'',single:!!t.single,inStats:t.inStats!==false}));}

/* ═════════ 하루 문서 ═════════ */
function emptyDay(date){return {date,ym:ymOf(date),th:[],bookings:[],blocks:[],cancels:[],manual:[],note:'',nid:0};}
function normDay(raw,date){const d=Object.assign(emptyDay(date),raw||{});['th','bookings','blocks','cancels','manual'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});d.date=date;d.ym=ymOf(date);return d;}
const sortBy=(a,k)=>a.slice().sort((x,y)=>(x[k]||0)-(y[k]||0));
function nearestDataDate(date){const L=META.dataDays.filter(x=>x!==date);if(!L.length)return null;const t=new Date(date).getTime();
  return L.slice().sort((a,b)=>Math.abs(new Date(a)-t)-Math.abs(new Date(b)-t)||(a<b?-1:1))[0];}
function lunchBlocks(date,ids,mk){if(isShortDay(date))return [];return ids.map(tid=>mk({therapistId:tid,startMin:780,endMin:840,kind:'off',text:'점심',color:'#999999',note:''}));}

/* 내원률 (lib/stats.ts dayRatios) — 시트의 getColorRatio 와 같은 규칙 */
function dayRatios(ids,bookings,blocks,endMin){
  const memos=blocks.filter(x=>x.kind==='memo');const key=m=>`${m.startMin}-${m.endMin}`;
  const shared=new Set(memos.map(key).filter(k=>ids.every(id=>memos.some(m=>m.therapistId===id&&key(m)===k))));
  const slots=(endMin-DAY_START)/SLOT;const out=new Map();
  for(const id of ids){const occ=Array(slots).fill('free');
    const mark=(s,e,v)=>{for(let m=s;m<e;m+=SLOT){const i=(m-DAY_START)/SLOT;if(i>=0&&i<slots)occ[i]=v;}};
    let usable=0,visit=0;
    for(const b of blocks.filter(x=>x.therapistId===id)){if(b.kind==='off'||shared.has(key(b)))mark(b.startMin,b.endMin,'off');else{mark(b.startMin,b.endMin,'used');usable++;}}
    for(const b of bookings.filter(x=>x.therapistId===id)){mark(b.startMin,b.startMin+b.durationMin,'used');usable++;if(b.visited)visit++;}
    for(let i=0;i<slots;i+=2)if(occ[i]==='free')usable++;
    out.set(id,usable===0?null:{usable,visit,ratio:visit/usable});}
  return out;}

/* 화면용 하루 (lib/day.ts getDay) */
function dayView(date,doc,near){
  const d=doc||emptyDay(date);
  let therapists=thOfDay(d.th,d.bookings),borrowedFrom=null,blocks=sortBy(d.blocks,'startMin');
  if(!therapists.length&&near&&near.th.length){borrowedFrom=near.date;therapists=thOfDay(near.th);
    blocks=lunchBlocks(date,therapists.map(t=>t.id),b=>Object.assign(b,{id:-b.therapistId,preview:true}));}
  const endMin=dayEndMin(date);const ym=ymOf(date);
  const seen=(META.manualNames[ym]||[]).map(n=>String(n).trim()).filter(n=>n&&!MANUAL_FIXED.includes(n));
  return {date,label:koreanDate(date),endMin,shortDay:isShortDay(date),therapists,borrowedFrom,
    ratios:dayRatios(therapists.map(t=>t.id),d.bookings,blocks,endMin),
    bookings:sortBy(d.bookings,'startMin'),blocks,cancels:sortBy(d.cancels,'startMin'),manual:sortBy(d.manual.filter(m=>!m.hidden),'no'),
    manualTherapists:[...MANUAL_FIXED,...[...new Set(seen)].sort((a,b)=>a.localeCompare(b,'ko'))],note:d.note||'',consults:(META.consults||{})[ym]||{}};}

/* ═════════ 쓰기 — 하루 문서를 트랜잭션으로 (동시 편집 보호) ═════════ */
const newId=d=>(d.nid=(d.nid||0)+1);
function ensureTh(ctx){const d=ctx.d;if(d.th.length||!ctx.near||!ctx.near.th.length)return;
  d.th=ctx.near.th.slice();lunchBlocks(d.date,d.th,b=>{d.blocks.push(Object.assign(b,{id:newId(d),updatedBy:'auto'}));return b;});}
function timeOk(s,e){return Number.isInteger(s)&&Number.isInteger(e)&&s>=DAY_START&&e<=DAY_END&&e>s&&s%SLOT===0&&e%SLOT===0;}
function aud(ctx,action,entity,entityId,before,after){ctx.audits.push({action,entity,entityId:String(entityId),date:ctx.d.date,before:jclone(before),after:jclone(after)});}
/* ═════ 되돌리기 (Ctrl+Z, 2026-10-07 요청) ═════
   이 화면에서 내가 한 저장마다 '바꾸기 전 하루 문서'를 기억해 두었다가(최근 50개) Ctrl+Z 로 하나씩 되돌린다.
   그 사이 다른 PC 가 같은 날을 고쳤으면(문서의 updatedAt 이 내가 쓴 값과 다르면) 그 사람 변경까지 지워지므로 되돌리지 않고 알린다.
   새로고침하면 기록은 사라진다. 치료사 정보·상담수(설정 문서)는 되돌리지 않는다 */
const UNDO=[];let NO_UNDO=false;
function undoLabel(a){const x=a[0];const L={create:'추가',update:'수정',delete:'삭제'};const E={bookings:'예약',work_blocks:'비근무/차단',cancels:'취소/변경',manual_tx:'Manual Tx',day_notes:'특이사항',day_therapists:'치료사 명단',day:'날짜 복사'};
  const nm=(x.after&&x.after.patientName)||(x.before&&x.before.patientName)||'';return (E[x.entity]||x.entity)+' '+(L[x.action]||x.action)+(nm?' ('+nm+')':'')+(a.length>1?' 외 '+(a.length-1)+'건':'');}
async function undoLast(){const u=UNDO[UNDO.length-1];if(!u){toast('되돌릴 변경이 없습니다 (이 화면에서 한 변경만, 새로고침 전까지)');return;}
  try{const r=await DB.runTransaction(async t=>{const ref=C.day.doc(u.date);const s=await t.get(ref);const cur=s.exists?s.data():null;
      if(!cur||cur.updatedAt!==u.after)return {ok:false,message:'그 뒤에 다른 PC(또는 자동 추가)에서 '+u.date+' 를 고쳐서 되돌릴 수 없습니다. 직접 고쳐 주세요.'};
      const prev=u.prev?JSON.parse(u.prev):emptyDay(u.date);prev.updatedAt=new Date().toISOString();prev.updatedBy=ME.name;t.set(ref,prev);return {ok:true};});
    if(!r.ok){toast(r.message,5000);UNDO.pop();return;}
    UNDO.pop();writeAudits([{action:'update',entity:'day',entityId:u.date,date:u.date,before:null,after:{undo:u.what}}]);
    toast('되돌렸습니다: '+u.what+' ('+u.date+')',3000);
    if(R.page!=='schedule'||R.q.date!==u.date)go('schedule',{date:u.date});}
  catch(e){console.error('undo',e);toast('되돌리지 못했습니다');}}
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.shiftKey||String(e.key).toLowerCase()!=='z')return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;   // 글자 입력 중의 Ctrl+Z 는 그 칸의 되돌리기
  if(!ME)return;e.preventDefault();undoLast();});
async function commitDay(date,fn){
  if(!isValidDate(date))return {ok:false,message:'잘못된 날짜입니다.'};
  let near=null;const nd=nearestDataDate(date);
  if(nd){try{const s=await C.day.doc(nd).get();if(s.exists)near=normDay(s.data(),nd);}catch(e){}}
  try{
    const r=await DB.runTransaction(async t=>{
      const ref=C.day.doc(date);const s=await t.get(ref);
      const prevRaw=s.exists?JSON.stringify(s.data()):null;   // 되돌리기(Ctrl+Z)용 — 바꾸기 전 그대로
      const d=s.exists?normDay(s.data(),date):emptyDay(date);
      const ctx={d,near,audits:[],extra:{}};
      const res=fn(ctx)||{ok:true};
      if(!res.ok)return res;
      d.updatedAt=new Date().toISOString();d.updatedBy=ME.name;
      t.set(ref,JSON.parse(JSON.stringify(d)));
      return Object.assign({},res,{audits:ctx.audits,hasTh:d.th.length>0,extra:ctx.extra,prevRaw,prevAt:s.exists?(s.data().updatedAt||null):null,after:d.updatedAt});});
    if(r.ok){
      const top=UNDO[UNDO.length-1];
      if(NO_UNDO){if(top&&top.date===date&&top.after===r.prevAt)top.after=r.after;}   // SASO 자동 채우기는 기록하지 않되, 내 되돌리기가 막히지 않게 이어 준다
      else{UNDO.push({date,prev:r.prevRaw,after:r.after,what:(r.audits[0]&&undoLabel(r.audits))||'변경'});if(UNDO.length>50)UNDO.shift();}
      if(r.hasTh&&!META.dataDays.includes(date))C.meta.set({dataDays:firebase.firestore.FieldValue.arrayUnion(date)},{merge:true}).catch(e=>console.warn(e));
      if(r.extra.manualName)C.meta.update(new firebase.firestore.FieldPath('manualNames',ymOf(date)),firebase.firestore.FieldValue.arrayUnion(r.extra.manualName)).catch(()=>C.meta.set({manualNames:{[ymOf(date)]:[r.extra.manualName]}},{merge:true}));
      writeAudits(r.audits);}
    return r;
  }catch(e){console.error('commit',e);return {ok:false,message:'저장하지 못했습니다. 잠시 후 다시 시도하세요.'};}}
function writeAudits(list){if(!list||!list.length)return;const b=DB.batch();const at=new Date().toISOString();
  list.forEach(a=>b.set(C.audit.doc(),Object.assign({at,user:ME.name,email:ME.email},a)));b.commit().catch(e=>console.warn('audit',e));}
async function commitMeta(fn,auditList){
  try{const r=await DB.runTransaction(async t=>{const s=await t.get(C.meta);const m=s.exists?s.data():{};if(!Array.isArray(m.therapists))m.therapists=[];
      const res=fn(m)||{ok:true};if(!res.ok)return res;t.set(C.meta,JSON.parse(JSON.stringify(m)));return res;});
    if(r.ok&&auditList)writeAudits(auditList.map(a=>Object.assign({date:null,before:null,after:null},a)));return r;}
  catch(e){console.error('meta',e);return {ok:false,message:'저장하지 못했습니다.'};}}

/* ── 예약 (lib/day.ts saveBooking 등과 같은 검사) ── */
function opBookingSave(input){return ctx=>{const d=ctx.d;
  const startMin=Number(input.startMin),durationMin=Number(input.durationMin);
  if(!timeOk(startMin,startMin+durationMin))return {ok:false,message:'시간이 잘못되었습니다. 9:00~21:00, 15분 단위여야 합니다.'};
  const therapistId=Number(input.therapistId);const mrn=clean(input.mrn,10);const patientName=clean(input.patientName,30);
  if(!mrn&&!patientName)return {ok:false,message:'차트번호나 이름 중 하나는 있어야 합니다.'};
  if(mrn&&!/^\d{1,7}$/.test(mrn))return {ok:false,message:'차트번호는 숫자 1~7자리입니다.'};
  const room=clean(input.room,4);
  const visitNo=input.visitNo==null||input.visitNo===''?null:Number(input.visitNo);
  if(visitNo!=null&&!(Number.isInteger(visitNo)&&visitNo>=0&&visitNo<1000))return {ok:false,message:'방문 횟수가 잘못되었습니다.'};
  const code=normalizeCode(clean(input.code,20));const codeColor=clean(input.codeColor,7).toLowerCase();let color=clean(input.color,7).toLowerCase();
  if(!colorOk(codeColor)||!colorOk(color))return {ok:false,message:'잘못된 색입니다.'};
  const visited=!!input.visited;if(visited)color='#ffe599';else if(color==='#ffe599')color='';
  const note=clean(input.note,1000);const endMin=startMin+durationMin;
  {const cl=d.bookings.filter(o=>o.therapistId===therapistId&&o.id!==input.id&&o.startMin<endMin&&startMin<o.startMin+o.durationMin);
   if(cl.length){const t=thById(therapistId);   /* 어느 예약과 겹치는지 알려 준다 (2026-10-07: 빈 칸인데 겹친다는 제보 — 화면에 안 보이는 예약일 수 있음) */
     return {ok:false,message:'같은 시간에 이미 다른 예약이 있습니다: '+cl.map(o=>(t?t.name+' ':'')+hm(o.startMin)+'~'+hm(o.startMin+o.durationMin)+' '+((o.patientName||o.mrn||o.rawText||'(이름 없음)')+(o.code?' '+o.code:''))+' #'+o.id).join(', ')};}}
  ensureTh(ctx);
  let before=null;if(input.id){before=d.bookings.find(b=>b.id===input.id)||null;if(!before)return {ok:false,message:'예약을 찾지 못했습니다. 새로고침하세요.'};}
  const mark=visited?((before&&String(before.mark||'').trim())||'.'):'';
  const now=new Date().toISOString();
  const values={therapistId,startMin,durationMin,mrn,room,patientName,visitNo,rawText:'',code,codeColor,color,visited,mark,note,updatedBy:ME.name,updatedAt:now};
  let row;
  if(before){row=Object.assign(before,values);}else{row=Object.assign({id:newId(d),createdBy:ME.name,createdAt:now},values);d.bookings.push(row);}
  aud(ctx,before?'update':'create','bookings',row.id,before?jclone(before):null,row);
  if(input.fromCancelId){const i=d.cancels.findIndex(c=>c.id===Number(input.fromCancelId));if(i>=0){const c=d.cancels.splice(i,1)[0];aud(ctx,'delete','cancels',c.id,c,{restoredToBooking:row.id});}}
  return {ok:true,value:row};};}
function findB(d,id){return d.bookings.find(b=>b.id===id)||null;}
/* 오늘 지우거나 취소한 환자는 동선관리의 신장분사 방 자동 추가가 다시 넣지 않게 기억 (2026-10-09: 지워도 다른 PC·새로고침에서 다시 들어왔다) */
const noAuto=(d,b)=>{const m=String(b.mrn||'').replace(/D/g,'');if(m&&!(d.autoNo||[]).includes(m))d.autoNo=[...(d.autoNo||[]),m];};
const opBookingDelete=id=>ctx=>{const i=ctx.d.bookings.findIndex(b=>b.id===id);if(i<0)return {ok:false,message:'이미 삭제된 예약입니다.'};const b=ctx.d.bookings.splice(i,1)[0];noAuto(ctx.d,b);aud(ctx,'delete','bookings',id,b,null);return {ok:true};};
const opBookingVisit=id=>ctx=>{const b=findB(ctx.d,id);if(!b)return {ok:false,message:'예약을 찾지 못했습니다.'};const visited=!b.visited;const was=b.visited;
  Object.assign(b,{visited,mark:visited?'.':'',color:visited?'#ffe599':b.color==='#ffe599'?'':b.color,updatedBy:ME.name,updatedAt:new Date().toISOString()});aud(ctx,'update','bookings',id,{visited:was},{visited});return {ok:true};};
const opBookingMark=(id,mark)=>ctx=>{const b=findB(ctx.d,id);if(!b)return {ok:false,message:'예약을 찾지 못했습니다.'};const m=String(mark??'').trim().slice(0,10);const visited=m!=='';
  b.markAt=m?new Date().toISOString():'';   // 표시 칸을 적은 시각 — 시작 분(예: 35)이 몇 시의 35분인지 정할 때 씀 (2026-10-07)
  const bf={mark:b.mark,visited:b.visited};Object.assign(b,{mark:m,visited,color:visited?'#ffe599':b.color==='#ffe599'?'':b.color,updatedBy:ME.name,updatedAt:new Date().toISOString()});aud(ctx,'update','bookings',id,bf,{mark:m,visited});return {ok:true};};
const opBookingNote=(id,note)=>ctx=>{const b=findB(ctx.d,id);if(!b)return {ok:false,message:'예약을 찾지 못했습니다.'};const n=String(note??'').trim().slice(0,1000);const bf=b.note;
  Object.assign(b,{note:n,updatedBy:ME.name,updatedAt:new Date().toISOString()});aud(ctx,'update','bookings',id,{note:bf},{note:n});return {ok:true};};
const opBookingColor=(id,color)=>ctx=>{const c=clean(color,7).toLowerCase();if(!colorOk(c))return {ok:false,message:'잘못된 색입니다.'};const b=findB(ctx.d,id);if(!b)return {ok:false,message:'예약을 찾지 못했습니다.'};
  const visited=c==='#ffe599'?true:c===''?false:b.visited;const bf={color:b.color,visited:b.visited};
  Object.assign(b,{color:c==='#ffe599'?'':c,visited,mark:visited?'.':'',updatedBy:ME.name,updatedAt:new Date().toISOString()});aud(ctx,'update','bookings',id,bf,{color:c,visited});return {ok:true};};
const opBookingCancel=(id,kind)=>ctx=>{const d=ctx.d;const b=findB(d,id);if(!b)return {ok:false,message:'예약을 찾지 못했습니다.'};const t=thById(b.therapistId);
  const text=b.mrn||b.patientName?`${b.mrn}${b.room?`(${b.room})`:''} ${b.patientName}${b.visitNo??''}`.trim():b.rawText;
  const row={id:newId(d),therapistName:t?t.name:'',startMin:b.startMin,kind,text,mrn:b.mrn,patientName:b.patientName,color:b.visited?'':b.color,note:'',
    /* 취소 칸 메모는 취소 메모만 — 예약의 메모·코드·길이 등은 bk 에 기억해 두었다가 [스케줄로 되돌리기] 때 그대로 (2026-10-08 요청) */
    bk:{therapistId:b.therapistId,durationMin:b.durationMin,room:b.room||'',visitNo:b.visitNo??null,code:b.code||'',codeColor:b.codeColor||'',color:b.visited?'':(b.color||''),note:b.note||''},updatedBy:ME.name,updatedAt:new Date().toISOString()};
  d.cancels.push(row);aud(ctx,'create','cancels',row.id,null,Object.assign({},row,{fromBooking:b.id}));
  if(kind==='cancel'){d.bookings.splice(d.bookings.indexOf(b),1);noAuto(d,b);aud(ctx,'delete','bookings',id,b,{movedToCancel:row.id});}
  return {ok:true};};

/* ── 비근무 / 메모 차단 ── */
function carve(ctx,tid,s,e){const d=ctx.d;const hit=d.blocks.filter(b=>b.therapistId===tid&&b.startMin<e&&s<b.endMin);
  for(const b of hit){d.blocks.splice(d.blocks.indexOf(b),1);
    if(b.startMin<s)d.blocks.push(Object.assign({},b,{id:newId(d),endMin:s,updatedBy:ME.name}));
    if(b.endMin>e)d.blocks.push(Object.assign({},b,{id:newId(d),startMin:e,updatedBy:ME.name}));}}
const opBlockSet=input=>ctx=>{const d=ctx.d;const s=Number(input.startMin),e=Number(input.endMin);if(!timeOk(s,e))return {ok:false,message:'시간이 잘못되었습니다.'};
  const kind=input.kind==='memo'?'memo':'off';const text=clean(input.text,40);const color=kind==='off'?'#999999':(clean(input.color,7).toLowerCase()||'#d9d9d9');
  if(!colorOk(color))return {ok:false,message:'잘못된 색입니다.'};
  ensureTh(ctx);
  const targets=input.all?d.th.slice():[Number(input.therapistId)];
  if(!targets.length)return {ok:false,message:'이 날에 치료사가 없습니다.'};
  const skipped=[];
  for(const tid of targets){
    if(d.bookings.some(b=>b.therapistId===tid&&b.startMin<e&&s<b.startMin+b.durationMin)){
      if(!input.all)return {ok:false,message:'그 시간에 예약이 있습니다. 예약을 먼저 옮기거나 삭제하세요.'};
      const t=thById(tid);skipped.push(t?t.name:String(tid));continue;}
    carve(ctx,tid,s,e);const row={id:newId(d),therapistId:tid,startMin:s,endMin:e,kind,text,color,note:'',updatedBy:ME.name,updatedAt:new Date().toISOString()};
    d.blocks.push(row);aud(ctx,'create','work_blocks',row.id,null,row);}
  if(skipped.length)return {ok:true,warn:`저장했지만 예약이 있는 치료사는 건너뛰었습니다: ${skipped.join(', ')}`};
  return {ok:true};};
const opBlockClear=(tid,s,e)=>ctx=>{if(!timeOk(s,e))return {ok:false,message:'시간이 잘못되었습니다.'};ensureTh(ctx);carve(ctx,tid,s,e);aud(ctx,'delete','work_blocks',`${tid}:${s}-${e}`,null,null);return {ok:true};};
const opBandClear=(tids,s,e)=>ctx=>{if(!timeOk(s,e))return {ok:false,message:'시간이 잘못되었습니다.'};ensureTh(ctx);tids.forEach(tid=>carve(ctx,tid,s,e));aud(ctx,'delete','work_blocks',`전원:${s}-${e}`,null,null);return {ok:true};};

/* ── 치료사 명단 (그날 순서) ── */
const opDayTherapists=ids=>ctx=>{const d=ctx.d;const before=d.th.slice();const uniq=[...new Set(ids.map(Number).filter(Number.isInteger))];d.th=uniq;
  if(!before.length&&uniq.length)lunchBlocks(d.date,uniq,b=>{d.blocks.push(Object.assign(b,{id:newId(d),updatedBy:'auto'}));return b;});
  aud(ctx,'update','day_therapists',d.date,before,uniq);return {ok:true};};
const opCopyLayout=from=>ctx=>{const d=ctx.d;d.th=from.th.slice();d.blocks=from.blocks.map(b=>Object.assign({},b,{id:newId(d),updatedBy:ME.name,updatedAt:new Date().toISOString()}));
  aud(ctx,'create','day',d.date,null,{copiedFrom:from.date});return {ok:true};};

/* ── 취소/변경, Manual Tx, 특이사항 ── */
const opCancelNote=(id,note)=>ctx=>{const c=ctx.d.cancels.find(x=>x.id===id);if(!c)return {ok:false,message:'기록을 찾지 못했습니다.'};const bf=c.note||'';const oc=/^코드\s*([A-Za-z0-9]+)$/.exec(bf.trim());if(oc&&!c.bk)c.bk={code:oc[1]};   // 예전 취소의 '코드 X' 는 되돌리기용으로 옮겨 둔다
  c.note=clean(note,1000);c.updatedBy=ME.name;c.updatedAt=new Date().toISOString();aud(ctx,'update','cancels',id,{note:bf},{note:c.note});return {ok:true};};
const opCancelSave=input=>ctx=>{const d=ctx.d;const s=Number(input.startMin);if(!timeOk(s,s+SLOT))return {ok:false,message:'시간이 잘못되었습니다.'};
  const text=clean(input.text,60);if(!text)return {ok:false,message:'내용을 입력하세요.'};const color=clean(input.color,7).toLowerCase();if(!colorOk(color))return {ok:false,message:'잘못된 색입니다.'};
  const m=/^(\d{1,7})/.exec(text);const kind=input.kind==='change'?'change':'cancel';
  const values={therapistName:clean(input.therapistName,20),startMin:s,kind,text,mrn:m?m[1]:'',patientName:'',color,updatedBy:ME.name,updatedAt:new Date().toISOString()};
  if(input.id){const c=d.cancels.find(x=>x.id===input.id);if(!c)return {ok:false,message:'기록을 찾지 못했습니다.'};const bf=jclone(c);Object.assign(c,values);aud(ctx,'update','cancels',c.id,bf,c);}
  else{const row=Object.assign({id:newId(d),note:''},values);d.cancels.push(row);aud(ctx,'create','cancels',row.id,null,row);}
  return {ok:true};};
const opCancelDelete=id=>ctx=>{const i=ctx.d.cancels.findIndex(c=>c.id===id);if(i<0)return {ok:false,message:'이미 삭제되었습니다.'};const c=ctx.d.cancels.splice(i,1)[0];aud(ctx,'delete','cancels',id,c,null);return {ok:true};};
const opManualSave=input=>ctx=>{const d=ctx.d;const mrn=clean(input.mrn,10),patientName=clean(input.patientName,30);if(!mrn&&!patientName)return {ok:false,message:'차트번호나 이름을 입력하세요.'};
  const color=clean(input.color,7).toLowerCase();if(!colorOk(color))return {ok:false,message:'잘못된 색입니다.'};
  const therapistName=clean(input.therapistName,20);
  const values={no:Number(input.no)||0,mrn,patientName,therapistName,color,updatedBy:ME.name,updatedAt:new Date().toISOString()};
  if(input.id){const m=d.manual.find(x=>x.id===input.id);if(!m)return {ok:false,message:'줄을 찾지 못했습니다.'};const bf=jclone(m);Object.assign(m,values);aud(ctx,'update','manual_tx',m.id,bf,m);}
  else{const row=Object.assign({id:newId(d),note:''},values);d.manual.push(row);aud(ctx,'create','manual_tx',row.id,null,row);}
  if(therapistName)ctx.extra.manualName=therapistName;
  return {ok:true};};
const opManualPatch=(id,patch)=>ctx=>{const m=ctx.d.manual.find(x=>x.id===id);if(!m)return {ok:false,message:'줄을 찾지 못했습니다.'};const bf={note:m.note,color:m.color};
  if(patch.note!==undefined)m.note=clean(patch.note,1000);
  if(patch.color!==undefined){const c=clean(patch.color,7).toLowerCase();if(!colorOk(c))return {ok:false,message:'잘못된 색입니다.'};m.color=c;}
  m.updatedBy=ME.name;m.updatedAt=new Date().toISOString();aud(ctx,'update','manual_tx',id,bf,patch);return {ok:true};};
const opManualDelete=id=>ctx=>{const i=ctx.d.manual.findIndex(x=>x.id===id);if(i<0)return {ok:false,message:'이미 삭제되었습니다.'};const m=ctx.d.manual.splice(i,1)[0];{const k=String(m.mrn||'').replace(/\D/g,'');if(k&&!(ctx.d.manNo||[]).includes(k))ctx.d.manNo=[...(ctx.d.manNo||[]),k];}   /* 지운 환자는 그 날 혜택 자동 추가가 다시 넣지 않게 (2026-10-11) */aud(ctx,'delete','manual_tx',id,m,null);return {ok:true};};
const opNote=text=>ctx=>{const t=clean(text,2000);const bf=ctx.d.note||'';ctx.d.note=t;aud(ctx,'update','day_notes',ctx.d.date,bf,t);return {ok:true};};

/* ── 치료사 정보·상담수 (설정 문서) ── */
async function addTherapist(name){const n=clean(name,20);if(!n)return {ok:false,message:'이름을 입력하세요.'};let id=null;
  const r=await commitMeta(m=>{let t=m.therapists.find(x=>x.name===n);
    if(t){t.active=true;id=t.id;}else{id=Math.max(Number(m.nextTid)||0,0,...m.therapists.map(x=>x.id))+1;m.nextTid=id;m.therapists.push({id,name:n,color:'',single:false,inStats:true,active:true,sortOrder:999});}
    return {ok:true};},[{action:'create',entity:'therapists',entityId:'',after:{name:n}}]);
  return r.ok?{ok:true,value:{id}}:r;}
const setThFlag=(id,k,v)=>commitMeta(m=>{const t=m.therapists.find(x=>x.id===id);if(!t)return {ok:false,message:'치료사를 찾지 못했습니다.'};t[k]=v;return {ok:true};},[{action:'update',entity:'therapists',entityId:String(id),after:{[k]:v}}]);
async function saveConsult(date,tid,count){const n=Number(count);if(!Number.isInteger(n)||n<0||n>9999)return {ok:false,message:'숫자를 입력하세요.'};const ym=ymOf(date);
  return commitMeta(m=>{m.consults=m.consults||{};m.consults[ym]=m.consults[ym]||{};m.consults[ym][tid]=n;return {ok:true};},[{action:'update',entity:'month_consults',entityId:`${ym}:${tid}`,date,after:{count:n}}]);}

/* ═════════ 화면 상태·라우팅 ═════════ */
let R={page:'schedule',q:{}};
let SUB=null,SUB_DATE=null,DAYDOC=undefined,NEARDOC=null,EDIT=null,PAINT=null,BUSY=false,MSG='';
const PAGES=[['schedule','일별 스케줄'],['m','간단 모드'],['stats','내원률 통계'],['treat','치료 통계'],['charts','그래프'],['audit','변경 기록'],['import','가져오기']];
function parseHash(){const h=location.hash.replace(/^#\/?/,'');const [p,qs]=h.split('?');const q={};(qs||'').split('&').forEach(kv=>{if(!kv)return;const [k,v]=kv.split('=');q[decodeURIComponent(k)]=decodeURIComponent(v||'');});
  return {page:PAGES.some(x=>x[0]===p)?p:'schedule',q};}
const href=(page,q)=>'#/'+page+(q&&Object.keys(q).length?'?'+Object.entries(q).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&'):'');
window.go=(page,q)=>{location.hash=href(page,q);};
function route(){R=parseHash();EDIT=null;MSG='';PAINT=null;renderEditor();
  if(R.page==='schedule'||R.page==='m'){const date=isValidDate(R.q.date||'')?R.q.date:todayYmd();R.q.date=date;watchDay(date);}
  render();}
function watchDay(date){if(SUB_DATE===date)return;if(SUB)SUB();SUB_DATE=date;DAYDOC=undefined;NEARDOC=null;
  SUB=C.day.doc(date).onSnapshot(async s=>{DAYDOC=s.exists?normDay(s.data(),date):null;
    if((!DAYDOC||!DAYDOC.th.length)){const nd=nearestDataDate(date);if(nd&&(!NEARDOC||NEARDOC.date!==nd)){try{const n=await C.day.doc(nd).get();NEARDOC=n.exists?normDay(n.data(),nd):null;}catch(e){NEARDOC=null;}}}
    safeRender();},e=>{console.warn('day',e);toast('스케줄을 읽지 못했습니다');});}
/* 글자를 치는 중에는 다시 그리지 않는다 — 다른 PC 의 저장이 들어와도 입력 중인 칸이 지워지지 않게 */
let PENDING=false;
function typing(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('#app'));}
/* 마우스를 누르고 있는 동안에도 다시 그리지 않는다 — 누르는 사이 칸이 새로 그려지면 그 클릭이 사라져 두 번 눌러야 열렸다 (2026-10-11). 뗀 뒤(클릭이 끝난 뒤) 그린다 */
let MOUSE_DOWN=false,RENDER_WAIT=false,DOWN_AT=0;
document.addEventListener('mousedown',e=>{if(e.button===0){MOUSE_DOWN=true;DOWN_AT=Date.now();}},true);
window.addEventListener('blur',()=>{if(MOUSE_DOWN){MOUSE_DOWN=false;if(RENDER_WAIT){RENDER_WAIT=false;setTimeout(safeRender,0);}}});   // 창 밖에서 뗀 경우
document.addEventListener('mouseup',()=>{if(!MOUSE_DOWN)return;MOUSE_DOWN=false;if(RENDER_WAIT){RENDER_WAIT=false;setTimeout(safeRender,0);}},true);
function safeRender(){if(MOUSE_DOWN&&Date.now()-DOWN_AT<4000){RENDER_WAIT=true;return;}MOUSE_DOWN=false;if(typing()){if(!PENDING){PENDING=true;document.activeElement.addEventListener('blur',()=>{setTimeout(()=>{PENDING=false;safeRender();},0);},{once:true});}return;}render();}
function navHtml(){return `<header class="nav"><nav>${PAGES.filter(p=>p[0]!=='import'||canImport()).map(([k,l])=>`<a href="${href(k,(k==='schedule'||k==='m')&&R.q.date?{date:R.q.date}:{})}" class="${R.page===k?'on':''}">${l}</a>`).join('')}</nav>
  <span class="who">${esc(ME?ME.name:'')}${EMBED?'':` <button type="button" class="ghost" onclick="AUTH.signOut()">로그아웃</button>`}</span></header>`;}
function render(){const app=document.getElementById('app');if(!ME)return;
  if(!metaReady){app.innerHTML=navHtml()+'<div class="loading">불러오는 중…</div>';return;}
  const p=R.page;let body='';
  try{
    if(p==='schedule')body=renderSchedule();
    else if(p==='m')body=renderMobile();
    else if(p==='stats')body=renderStatsPage();
    else if(p==='treat')body=renderTreatPage();
    else if(p==='charts')body=renderChartsPage();
    else if(p==='audit')body=renderAuditPage();
    else if(p==='import')body=renderImportPage();
  }catch(e){console.error(e);body=`<p class="err">화면을 그리지 못했습니다: ${esc(e.message)}</p>`;}
  app.innerHTML=navHtml()+body;
  if(p==='schedule'){const L=app.querySelector('.sheet-layout');if(L)L.focus({preventScroll:true});}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(EDIT){EDIT=null;MSG='';renderEditor();render();}else if(PAINT){PAINT=null;render();}}});

/* 실행 도우미: 저장 → 결과 */
async function run(date,op,closeOnOk=true){if(BUSY)return false;BUSY=true;MSG='';renderEditor();
  const r=await commitDay(date,op);BUSY=false;
  if(!r.ok){MSG=r.message||'실패';renderEditor();if(!EDIT)toast(MSG);return false;}
  if(r.warn){MSG=r.warn;toast(r.warn,4000);}
  if(closeOnOk){EDIT=null;MSG='';}
  renderEditor();safeRender();return r;}
async function runMeta(promise,closeOnOk){BUSY=true;renderEditor();const r=await promise;BUSY=false;if(!r.ok){MSG=r.message||'실패';renderEditor();toast(MSG);return false;}if(closeOnOk){EDIT=null;MSG='';}renderEditor();safeRender();return r;}
</script>
